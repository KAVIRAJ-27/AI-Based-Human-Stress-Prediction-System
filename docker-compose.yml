version: '3.8'

services:
  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    container_name: stressguard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-54400171}
      MYSQL_DATABASE: stress_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Flask ML Service
  ml-service:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: stressguard-ml
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stressguard-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_URL=jdbc:mysql://mysql:3306/stress_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-54400171}
      - ML_SERVICE_URL=http://ml-service:5000
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started

  # Frontend Nginx Web Server
  frontend:
    image: nginx:alpine
    container_name: stressguard-frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mysql_data:
