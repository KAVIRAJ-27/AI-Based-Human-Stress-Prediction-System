<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StressGuard AI 2.0 – Clinical Intelligence & Stress Prediction</title>
  
  <!-- Modern Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Bootstrap 5 & Chart.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

  <style>
    /* =========================================================================
       ULTRA-PREMIUM DESIGN SYSTEM & THEME TOKENS
       ========================================================================= */
    :root {
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-heading: 'Outfit', 'Plus Jakarta Sans', sans-serif;

      /* Dark Theme (Default) */
      --bg-base: #070913;
      --bg-surface: rgba(15, 23, 42, 0.72);
      --bg-surface-elevated: rgba(30, 41, 59, 0.65);
      --bg-card: rgba(18, 24, 43, 0.65);
      --bg-card-hover: rgba(28, 38, 68, 0.8);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.35);
      --border-glow: rgba(99, 102, 241, 0.5);

      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      /* Brand Accents */
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-dark: #4338ca;
      --primary-glow: rgba(99, 102, 241, 0.35);

      --secondary: #06b6d4;
      --secondary-glow: rgba(6, 182, 212, 0.35);

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-glow: rgba(16, 185, 129, 0.3);

      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-glow: rgba(245, 158, 11, 0.3);

      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-glow: rgba(239, 68, 68, 0.3);

      --glass-blur: blur(24px) saturate(190%);
      --card-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-subtle);
      --topbar-h: 70px;
      --sidebar-w: 270px;
    }

    /* Light Theme Overrides */
    [data-theme="light"] {
      --bg-base: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --bg-surface-elevated: rgba(255, 255, 255, 0.95);
      --bg-card: rgba(255, 255, 255, 0.8);
      --bg-card-hover: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(148, 163, 184, 0.2);
      --border-accent: rgba(99, 102, 241, 0.4);
      --border-glow: rgba(99, 102, 241, 0.3);

      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --card-shadow: 0 12px 30px -4px rgba(99, 102, 241, 0.12), 0 0 0 1px var(--border-subtle);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: var(--font-body); color: var(--text-main); background: var(--bg-base); transition: background-color 0.3s ease, color 0.3s ease; overflow-x: hidden; }

    /* Animated Ambient Orb Backdrops */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.28;
      animation: floatOrb 22s ease-in-out infinite alternate;
    }
    .orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, #6366f1, #3b82f6); top: -120px; left: -100px; animation-duration: 25s; }
    .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #06b6d4, #10b981); bottom: -80px; right: -80px; animation-duration: 20s; }
    .orb-3 { width: 400px; height: 400px; background: radial-gradient(circle, #ec4899, #8b5cf6); top: 40%; left: 35%; animation-duration: 28s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-30px, 40px) scale(0.95); }
    }

    #root { position: relative; z-index: 1; }

    /* Layout */
    .app-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--border-subtle);
      position: fixed;
      top: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-brand {
      padding: 1.5rem 1.4rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: 0.75rem;
    }
    .brand-icon {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px var(--primary-glow);
      color: white; font-size: 1.4rem;
    }
    .brand-text h1 {
      font-family: var(--font-heading);
      font-size: 1.22rem; font-weight: 800; margin: 0;
      background: linear-gradient(135deg, #ffffff, #c7d2fe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    [data-theme="light"] .brand-text h1 {
      background: linear-gradient(135deg, #1e1b4b, #4338ca);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-text span {
      font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--secondary); font-weight: 700;
    }

    .sidebar-nav { padding: 1.2rem 0.9rem; flex: 1; overflow-y: auto; }
    .nav-label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-muted); padding: 0.8rem 0.9rem 0.35rem; font-weight: 700;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 0.85rem;
      width: 100%; padding: 0.72rem 1rem; margin-bottom: 0.3rem;
      border-radius: 12px; border: 1px solid transparent;
      background: transparent; color: var(--text-secondary);
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }
    .nav-btn:hover {
      background: var(--border-subtle); color: var(--text-main);
      transform: translateX(3px);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(168, 85, 247, 0.15));
      border-color: var(--border-accent);
      color: #fff; box-shadow: 0 4px 20px var(--primary-glow);
    }
    [data-theme="light"] .nav-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.14), rgba(168, 85, 247, 0.08));
      color: var(--primary-dark);
    }

    .sidebar-footer {
      padding: 1rem 1.1rem;
      border-top: 1px solid var(--border-subtle);
      background: rgba(0,0,0,0.1);
      display: flex; align-items: center; gap: 0.8rem;
    }
    .user-avatar {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white; font-weight: 700; display: flex;
      align-items: center; justify-content: center; font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    /* Main Area */
    .main-wrap { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }
    
    /* Topbar */
    .topbar {
      height: var(--topbar-h);
      padding: 0 2rem;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 90;
    }
    .topbar-title {
      font-family: var(--font-heading);
      font-size: 1.25rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .topbar-tools { display: flex; align-items: center; gap: 0.85rem; }

    /* Glass Cards */
    .card-glass {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      transition: border-color 0.25s ease, transform 0.2s ease;
      overflow: hidden;
    }
    .card-glass:hover { border-color: var(--border-accent); }
    .card-glass-header {
      padding: 1.25rem 1.6rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-heading); font-weight: 700; font-size: 1.05rem;
    }
    .card-glass-body { padding: 1.6rem; }

    /* Stat Cards */
    .metric-card {
      padding: 1.4rem 1.5rem;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .metric-card:hover { transform: translateY(-3px); }
    .metric-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: var(--metric-color, var(--primary));
    }
    .metric-val {
      font-family: var(--font-heading);
      font-size: 2.1rem; font-weight: 800; line-height: 1.1; margin-top: 0.4rem;
    }
    .metric-label {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 700;
    }
    .metric-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.72rem; padding: 0.2rem 0.55rem; border-radius: 20px;
      font-weight: 700; margin-top: 0.6rem;
    }

    /* Buttons */
    .btn-glow {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff; font-weight: 700; font-size: 0.9rem;
      padding: 0.65rem 1.5rem; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 6px 22px var(--primary-glow);
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-glow:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-2px); box-shadow: 0 8px 26px var(--primary-glow);
      color: #fff;
    }
    .btn-glow:active { transform: translateY(0); }

    .btn-glass {
      background: var(--bg-surface-elevated);
      color: var(--text-main); font-weight: 600; font-size: 0.86rem;
      padding: 0.55rem 1.1rem; border-radius: 12px;
      border: 1px solid var(--border-subtle);
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 0.45rem;
    }
    .btn-glass:hover {
      border-color: var(--border-accent); background: var(--bg-card-hover);
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary); display: flex;
      align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-icon:hover { border-color: var(--border-accent); color: var(--text-main); }

    /* Category Pill Selector */
    .category-tabs {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .cat-tab {
      padding: 0.55rem 1.15rem; border-radius: 14px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary); font-size: 0.86rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .cat-tab:hover { color: var(--text-main); border-color: var(--border-accent); }
    .cat-tab.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(6, 182, 212, 0.2));
      border-color: var(--primary-light); color: var(--text-main);
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    /* Sliders */
    .slider-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px; padding: 1rem 1.2rem;
      transition: all 0.2s ease;
    }
    .slider-card:hover { border-color: var(--border-accent); }
    .slider-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.6rem;
    }
    .slider-title { font-weight: 600; font-size: 0.88rem; color: var(--text-main); }
    .slider-val-badge {
      font-family: var(--font-heading);
      font-weight: 700; font-size: 0.95rem; min-width: 38px; text-align: center;
      padding: 0.15rem 0.55rem; border-radius: 8px;
      background: var(--primary-glow); color: var(--primary-light);
      border: 1px solid var(--border-accent);
    }
    .slider-hint { font-size: 0.72rem; color: var(--text-muted); }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 6px;
      background: rgba(148, 163, 184, 0.25); outline: none; margin: 0.6rem 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      cursor: pointer; box-shadow: 0 0 12px var(--primary);
      border: 2px solid white; transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* Presets Strip */
    .preset-pill {
      padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.8rem;
      font-weight: 600; border: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated); color: var(--text-secondary);
      cursor: pointer; transition: all 0.2s ease;
    }
    .preset-pill:hover { border-color: var(--border-accent); color: var(--text-main); background: var(--bg-card-hover); }

    /* Results Showcase Card */
    .result-hero {
      border-radius: 24px; padding: 2.2rem; text-align: center;
      position: relative; overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.4);
    }
    .result-hero.low {
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.25), rgba(16, 185, 129, 0.05)), var(--bg-card);
      border-color: rgba(16, 185, 129, 0.4);
    }
    .result-hero.medium {
      background: radial-gradient(circle at center, rgba(245, 158, 11, 0.25), rgba(245, 158, 11, 0.05)), var(--bg-card);
      border-color: rgba(245, 158, 11, 0.4);
    }
    .result-hero.high {
      background: radial-gradient(circle at center, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.08)), var(--bg-card);
      border-color: rgba(239, 68, 68, 0.45);
    }
    .result-level-title {
      font-family: var(--font-heading);
      font-size: 3.5rem; font-weight: 900; line-height: 1; letter-spacing: -0.02em;
    }
    .result-hero.low .result-level-title { color: #34d399; }
    .result-hero.medium .result-level-title { color: #fbbf24; }
    .result-hero.high .result-level-title { color: #f87171; }

    /* 4-7-8 Breathing Circle Widget */
    .breath-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2.2rem 1.5rem; text-align: center;
    }
    .breath-circle-wrap {
      position: relative; width: 180px; height: 180px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
    }
    .breath-circle {
      width: 140px; height: 140px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.5), rgba(6, 182, 212, 0.25));
      border: 2px solid var(--border-accent);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      box-shadow: 0 0 30px var(--primary-glow);
      transition: transform 1s ease-in-out;
    }
    .breath-circle.inhale { transform: scale(1.25); box-shadow: 0 0 45px rgba(6, 182, 212, 0.7); }
    .breath-circle.hold { transform: scale(1.25); border-color: #f59e0b; box-shadow: 0 0 45px rgba(245, 158, 11, 0.7); }
    .breath-circle.exhale { transform: scale(0.9); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }

    /* Tables */
    .table-modern { width: 100%; border-collapse: separate; border-spacing: 0; }
    .table-modern th {
      padding: 0.85rem 1.2rem; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted); font-weight: 700;
      border-bottom: 1px solid var(--border-subtle); background: rgba(0,0,0,0.06);
    }
    .table-modern td {
      padding: 1rem 1.2rem; font-size: 0.88rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary); vertical-align: middle;
    }
    .table-modern tr:hover td { background: var(--bg-surface-elevated); color: var(--text-main); }

    /* Badges */
    .badge-stress {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.3rem 0.8rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.03em;
    }
    .badge-stress.low { background: var(--success-bg); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-stress.medium { background: var(--warning-bg); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-stress.high { background: var(--danger-bg); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Form Inputs */
    .form-control-modern {
      width: 100%; padding: 0.7rem 1rem; border-radius: 12px;
      background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);
      color: var(--text-main); font-size: 0.9rem; outline: none;
      transition: all 0.2s ease;
    }
    .form-control-modern:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-control-modern::placeholder { color: var(--text-muted); }

    /* Toast Notification */
    .toast-popup {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-accent);
      border-radius: 16px; padding: 1rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: var(--glass-blur);
      display: flex; align-items: center; gap: 0.8rem;
      animation: slideInToast 0.3s ease;
    }
    @keyframes slideInToast {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Print Styles */
    @media print {
      .sidebar, .topbar, .ambient-bg, .btn-glow, .btn-glass, .btn-icon, .preset-pill { display: none !important; }
      .main-wrap { margin-left: 0 !important; }
      body { background: white !important; color: black !important; }
      .card-glass { border: 1px solid #ccc !important; box-shadow: none !important; }
    }

    @media (max-width: 992px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0; }
    }
  </style>
</head>
<body>

<div class="ambient-bg">
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>
</div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ─── API Layer ──────────────────────────────────────────────────────────────
const getApiBase = () => {
  const custom = localStorage.getItem('api_endpoint');
  if (custom) return custom.replace(/\/+$/, '');
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return 'http://localhost:8080/api';
  }
  return 'https://stress-prediction-backend.onrender.com/api';
};

const api = {
  token: () => localStorage.getItem('jwt_token'),
  headers: () => ({
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${api.token()}`
  }),

  async post(path, body, auth = false) {
    const res = await fetch(getApiBase() + path, {
      method: 'POST',
      headers: auth ? { 'Content-Type': 'application/json' } : api.headers(),
      body: JSON.stringify(body)
    });
    const text = await res.text();
    let data = {};
    if (text) {
      try { data = JSON.parse(text); } catch { data = { message: text }; }
    }
    if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
    return data;
  },

  async get(path) {
    const res = await fetch(getApiBase() + path, { headers: api.headers() });
    const text = await res.text();
    let data = {};
    if (text) {
      try { data = JSON.parse(text); } catch { data = { message: text }; }
    }
    if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
    return data;
  },

  async put(path, body) {
    const res = await fetch(getApiBase() + path, {
      method: 'PUT',
      headers: api.headers(),
      body: JSON.stringify(body)
    });
    const text = await res.text();
    let data = {};
    if (text) {
      try { data = JSON.parse(text); } catch { data = { message: text }; }
    }
    if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
    return data;
  },

  async del(path) {
    const res = await fetch(getApiBase() + path, { method: 'DELETE', headers: api.headers() });
    if (!res.ok) throw new Error('Delete failed');
  }
};

// ─── Web Audio Ambient Soundscape Generator ──────────────────────────────────
class AmbientSoundGenerator {
  constructor() {
    this.ctx = null;
    this.isPlaying = false;
    this.nodes = [];
  }

  start() {
    if (this.isPlaying) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioContext();

    // Pink / Gentle Rain Filtered Noise
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.06;
      b6 = white * 0.115926;
    }

    const whiteNoise = this.ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    // Soothing low-pass filter (simulates calm rain)
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 850;

    const gainNode = this.ctx.createGain();
    gainNode.gain.setValueAtTime(0.2, this.ctx.currentTime);

    whiteNoise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(this.ctx.destination);

    whiteNoise.start(0);
    this.nodes = [whiteNoise, filter, gainNode];
    this.isPlaying = true;
  }

  stop() {
    if (!this.isPlaying) return;
    this.nodes.forEach(n => { try { n.stop && n.stop(); n.disconnect(); } catch(e){} });
    if (this.ctx) { try { this.ctx.close(); } catch(e){} }
    this.isPlaying = false;
  }
}

// ─── Interactive 4-7-8 Breathing Tool ────────────────────────────────────────
function BreathingExerciseWidget() {
  const [active, setActive] = useState(false);
  const [phase, setPhase] = useState('Ready'); // 'Inhale', 'Hold', 'Exhale'
  const [countdown, setCountdown] = useState(4);

  useEffect(() => {
    if (!active) {
      setPhase('Ready');
      setCountdown(4);
      return;
    }

    let timer;
    let step = 0; // 0: inhale (4), 1: hold (7), 2: exhale (8)
    const phases = [
      { name: 'Inhale', duration: 4 },
      { name: 'Hold', duration: 7 },
      { name: 'Exhale', duration: 8 }
    ];

    setPhase(phases[0].name);
    setCountdown(phases[0].duration);

    const interval = setInterval(() => {
      setCountdown(prev => {
        if (prev > 1) return prev - 1;
        step = (step + 1) % 3;
        setPhase(phases[step].name);
        return phases[step].duration;
      });
    }, 1000);

    return () => clearInterval(interval);
  }, [active]);

  return (
    <div className="breath-box">
      <div className="breath-circle-wrap">
        <div className={`breath-circle ${active ? phase.toLowerCase() : ''}`}>
          <div style={{ fontSize: '0.78rem', textTransform: 'uppercase', letterSpacing: '0.1em', opacity: 0.8 }}>
            {phase}
          </div>
          <div style={{ fontFamily: 'var(--font-heading)', fontSize: '2.2rem', fontWeight: 800, lineHeight: 1 }}>
            {active ? countdown : '🧘'}
          </div>
        </div>
      </div>

      <div style={{ fontWeight: 700, fontSize: '1.05rem', marginBottom: '0.3rem' }}>
        4-7-8 Clinical Relaxation Pacer
      </div>
      <div style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', maxWidth: 280, marginBottom: '1.2rem' }}>
        {phase === 'Inhale' && 'Breathe in slowly through your nose...'}
        {phase === 'Hold' && 'Hold breath gently without straining...'}
        {phase === 'Exhale' && 'Release through your mouth with a gentle whoosh...'}
        {phase === 'Ready' && 'Stimulates the parasympathetic nervous system to quickly de-escalate anxiety.'}
      </div>

      <button
        className={active ? 'btn-glass' : 'btn-glow'}
        onClick={() => setActive(!active)}
      >
        {active ? '⏸ Pause Pacer' : '▶ Start Breathing Session'}
      </button>
    </div>
  );
}

function DashboardView({ user, setPage }) {
  const [data, setData] = useState(null);
  const [history, setHistory] = useState([]);
  const donutChartRef = useRef();
  const trendChartRef = useRef();
  const donutInst = useRef();
  const trendInst = useRef();

  useEffect(() => {
    Promise.all([
      api.get('/predict/dashboard'),
      api.get('/predict/history')
    ]).then(([dash, hist]) => {
      setData(dash);
      setHistory(hist);
    }).catch(console.error);
  }, []);

  // Compute Wellness Index (0 to 100)
  const wellnessIndex = useMemo(() => {
    if (!data || data.totalMyPredictions === 0) return 85;
    const low = data.myLowCount || 0;
    const med = data.myMediumCount || 0;
    const high = data.myHighCount || 0;
    const total = low + med + high || 1;
    const score = Math.round(((low * 100) + (med * 60) + (high * 20)) / total);
    return Math.max(10, Math.min(98, score));
  }, [data]);

  // Donut Chart
  useEffect(() => {
    if (!data || !donutChartRef.current) return;
    if (donutInst.current) donutInst.current.destroy();

    donutInst.current = new Chart(donutChartRef.current, {
      type: 'doughnut',
      data: {
        labels: ['Low Stress', 'Medium Stress', 'High Stress'],
        datasets: [{
          data: [data.myLowCount || 0, data.myMediumCount || 0, data.myHighCount || 0],
          backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
          borderWidth: 0,
          hoverOffset: 6
        }]
      },
      options: {
        cutout: '72%',
        plugins: {
          legend: { position: 'bottom', labels: { color: 'rgba(148, 163, 184, 0.9)', font: { family: 'Plus Jakarta Sans', size: 11 } } }
        },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }, [data]);

  // Trend Chart (Stress over time)
  useEffect(() => {
    if (!history.length || !trendChartRef.current) return;
    if (trendInst.current) trendInst.current.destroy();

    const sorted = [...history].sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)).slice(-10);
    const labels = sorted.map(h => new Date(h.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' }));
    const scores = sorted.map(h => h.stressLabel === 'Low' ? 1 : h.stressLabel === 'Medium' ? 2 : 3);

    trendInst.current = new Chart(trendChartRef.current, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Stress Tier',
          data: scores,
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99, 102, 241, 0.15)',
          fill: true,
          tension: 0.4,
          pointRadius: 5,
          pointBackgroundColor: sorted.map(h => h.stressLabel === 'Low' ? '#10b981' : h.stressLabel === 'Medium' ? '#f59e0b' : '#ef4444')
        }]
      },
      options: {
        scales: {
          y: {
            min: 0.5, max: 3.5,
            ticks: {
              stepSize: 1,
              callback: v => v === 1 ? 'Low' : v === 2 ? 'Medium' : v === 3 ? 'High' : ''

            grid: { color: 'rgba(255,255,255,0.06)' }

          x: { grid: { color: 'rgba(255,255,255,0.06)' } }
        },
        plugins: { legend: { display: false } },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }, [history]);

  if (!data) return <div style={{ padding: '3rem', textAlign: 'center', color: 'var(--text-muted)' }}>⏳ Initializing your personalized intelligence dashboard...</div>;

  return (
    <div style={{ padding: '2rem' }}>

          <div>
            <div style={{ fontSize: '0.8rem', textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--secondary)', fontWeight: 700 }}>
              🧠 Personal Wellness Cockpit
            </div>
            <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: '0.3rem 0' }}>
              Welcome back, {user?.fullName || user?.username}!

            <p style={{ margin: 0, color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
              Real-time physiological, cognitive, and environmental stress surveillance powered by Random Forest AI.
            </p>

      </div>

      {/* Metric Cards Grid */}
      <div className="row g-3 mb-4">
        <div className="col-md-3">
          <div className="metric-card" style={{ '--metric-color': '#6366f1' }}>
            <div className="metric-label">Wellness Index</div>

              {wellnessIndex}<span style={{ fontSize: '1.1rem', opacity: 0.6 }}>/100</span>

            <div className="metric-badge" style={{ background: 'rgba(99, 102, 241, 0.15)', color: '#818cf8' }}>
              {wellnessIndex > 70 ? '🟢 Optimal Balance' : wellnessIndex > 45 ? '🟡 Moderate Strain' : '🔴 Critical Watch'}

// ─── Prediction Page (5-Domain Assessment & Presets) ─────────────────────────
function PredictionView() {
  const [activeDomain, setActiveDomain] = useState('psychological');
  const [vals, setVals] = useState(() => {
    return ALL_FIELDS.reduce((acc, f) => ({ ...acc, [f.key]: Math.floor((f.min + f.max) / 2) }), {});
  });
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [actionDone, setActionDone] = useState({});

  const probChartRef = useRef();
  const radarChartRef = useRef();
  const probInst = useRef();
  const radarInst = useRef();

  const applyPreset = (preset) => {
    setVals(prev => ({ ...prev, ...preset.values }));
    setResult(null);
  };

  const handlePredict = async (e) => {
    e.preventDefault();
    setLoading(true); setError(''); setResult(null);
    try {
      const data = await api.post('/predict', vals);
      setResult(data);
    } catch(err) {
      setError(err.message);
    }
    setLoading(false);
  };

  // Probability Distribution Bar Chart
  useEffect(() => {
    if (!result || !probChartRef.current) return;
    if (probInst.current) probInst.current.destroy();

    const p = result.probabilities;
    probInst.current = new Chart(probChartRef.current, {
      type: 'bar',
      data: {
        labels: ['Low Stress', 'Medium Stress', 'High Risk'],
        datasets: [{
          data: [p.Low, p.Medium, p.High],
          backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
          borderRadius: 8
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' }, grid: { color: 'rgba(255,255,255,0.06)' } },
          x: { grid: { display: false } }
        },
        plugins: { legend: { display: false } },
        responsive: true,
        maintainAspectRatio: false
      }

  // Radar / Spider Chart across 5 Domains
  useEffect(() => {
    if (!result || !radarChartRef.current) return;
    if (radarInst.current) radarInst.current.destroy();

    // Calculate domain vulnerability scores (0 - 100%)
    const domainScores = [
      Math.round(((vals.anxietyLevel/21 + (30-vals.selfEsteem)/30 + vals.depression/27) / 3) * 100), // Psycho
      Math.round(((vals.headache/5 + vals.bloodPressure/3 + (9-vals.sleepQuality)/9 + vals.breathingProblem/5) / 4) * 100), // Physio
      Math.round(((vals.noiseLevel/7 + (5-vals.livingConditions)/5 + (5-vals.safety)/5 + (5-vals.basicNeeds)/5) / 4) * 100), // Environ
      Math.round(((vals.studyLoad/5 + (5-vals.academicPerformance)/5 + (5-vals.teacherStudentRelationship)/5 + vals.futureCareerConcerns/5) / 4) * 100), // Academic

    radarInst.current = new Chart(radarChartRef.current, {
      type: 'radar',
      data: {
        labels: ['Psychological', 'Physiological', 'Living Env', 'Academic Load', 'Social Strain'],

      options: {

      {/* Preset Personas Bar */}

// ─── History View with CSV Export ────────────────────────────────────────────
function HistoryView() {
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filterTier, setFilterTier] = useState('ALL');
  const [search, setSearch] = useState('');

  useEffect(() => {
    api.get('/predict/history')
      .then(d => { setHistory(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const exportCSV = () => {
    if (!history.length) return;
    const headers = ['ID', 'Date', 'Stress_Level', 'Confidence_Percentage'];
    const rows = history.map(h => [
      h.id,
      new Date(h.createdAt).toISOString(),
      h.stressLabel,
      h.confidence
    ]);
    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `stress_predictions_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const filtered = history.filter(h => {
    const matchesTier = filterTier === 'ALL' || h.stressLabel?.toUpperCase() === filterTier;
    const matchesSearch = !search || h.stressLabel?.toLowerCase().includes(search.toLowerCase()) || new Date(h.createdAt).toLocaleDateString().includes(search);
    return matchesTier && matchesSearch;
  });

  return (
    <div style={{ padding: '2rem' }}>
      <div className="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
          <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: 0 }}>
            📋 Prediction Logs & Clinical History
          </h2>
          <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem', margin: '0.25rem 0 0' }}>
            Complete audit trail of user submissions with confidence indices and timestamps.
          </p>
        </div>

        <div className="d-flex gap-2">
          <button className="btn-glow" onClick={exportCSV} disabled={!history.length}>
            <Icon name="download" size={16} /> Export to CSV
          </button>
          <button className="btn-glass" onClick={() => window.print()}>
            <Icon name="printer" size={16} /> Print Sheet
          </button>
        </div>
      </div>

      <div className="card-glass">
        {/* Table Filters */}
        <div style={{ padding: '1rem 1.4rem', borderBottom: '1px solid var(--border-subtle)', display: 'flex', gap: '0.8rem', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between' }}>
          <div className="d-flex gap-2">
            {['ALL', 'LOW', 'MEDIUM', 'HIGH'].map(tier => (
              <button
                key={tier}
                className={`preset-pill ${filterTier === tier ? 'btn-glass' : ''}`}
                style={{ borderColor: filterTier === tier ? 'var(--primary)' : 'var(--border-subtle)' }}
                onClick={() => setFilterTier(tier)}
              >
                {tier === 'ALL' ? 'All Tiers' : tier}
              </button>
            ))}
          </div>
          <input
            className="form-control-modern"
            style={{ width: 220, padding: '0.45rem 0.8rem', fontSize: '0.82rem' }}
            placeholder="🔍 Search dates..."
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
        </div>

        <div className="card-glass-body p-0">
          {loading ? (
            <div style={{ padding: '3rem', textAlign: 'center', color: 'var(--text-muted)' }}>Loading history records...</div>
          ) : filtered.length === 0 ? (
            <div style={{ padding: '3.5rem', textAlign: 'center', color: 'var(--text-muted)' }}>No matching prediction records found.</div>
          ) : (
            <table className="table-modern">
              <thead>
                <tr>
                  <th>#ID</th>
                  <th>Recorded Timestamp</th>
                  <th>Classification</th>
                  <th>Model Confidence</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(h => (
                  <tr key={h.id}>
                    <td style={{ fontFamily: 'monospace', color: 'var(--text-muted)' }}>#{h.id}</td>
                    <td style={{ fontWeight: 600 }}>{new Date(h.createdAt).toLocaleString()}</td>
                    <td>
                      <span className={`badge-stress ${h.stressLabel?.toLowerCase()}`}>
                        {h.stressLabel}
                      </span>
                    </td>
                    <td>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                        <div style={{ width: 70, height: 6, borderRadius: 3, background: 'rgba(255,255,255,0.1)', overflow: 'hidden' }}>
                          <div
                            style={{
                              width: `${h.confidence}%`, height: '100%',
                              background: h.stressLabel === 'Low' ? '#10b981' : h.stressLabel === 'Medium' ? '#f59e0b' : '#ef4444'
                            }}
                          />
                        </div>
                        <span style={{ fontWeight: 700 }}>{h.confidence?.toFixed(1)}%</span>
                      </div>
                    </td>
                    <td><span style={{ fontSize: '0.78rem', color: '#10b981' }}>✓ Model Saved</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Profile View ────────────────────────────────────────────────────────────

// ─── Admin Dashboard View ───────────────────────────────────────────────────
function AdminDashboardView() {
  const [stats, setStats] = useState(null);
  const [dist, setDist] = useState(null);
  const [recent, setRecent] = useState([]);
  const pieRef = useRef();
  const pieInst = useRef();

  useEffect(() => {
    Promise.all([
      api.get('/admin/stats'),
      api.get('/admin/stress-distribution'),
      api.get('/admin/recent-predictions?limit=10')
    ]).then(([s, d, r]) => {
      setStats(s);
      setDist(d);
      setRecent(r);
    }).catch(console.error);
  }, []);

  useEffect(() => {
    if (!dist || !pieRef.current) return;
    if (pieInst.current) pieInst.current.destroy();

    pieInst.current = new Chart(pieRef.current, {
      type: 'pie',
      data: {
        labels: Object.keys(dist),
        datasets: [{
          data: Object.values(dist),
          backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
          borderWidth: 0

      options: {
        plugins: {
          legend: { position: 'bottom', labels: { color: 'rgba(148, 163, 184, 0.9)' } }

        responsive: true,
        maintainAspectRatio: false

  if (!stats) return <div style={{ padding: '3rem', textAlign: 'center', color: 'var(--text-muted)' }}>Loading enterprise system statistics...</div>;

  return (
    <div style={{ padding: '2rem' }}>
      <div className="mb-4">

          <div className="metric-card" style={{ '--metric-color': '#6366f1' }}>
            <div className="metric-label">Total Users</div>

          <div className="metric-card" style={{ '--metric-color': '#06b6d4' }}>
            <div className="metric-label">Inferences</div>
            <div className="metric-val">{stats.totalPredictions}</div>
          </div>
        </div>
        <div className="col">
          <div className="metric-card" style={{ '--metric-color': '#10b981' }}>
            <div className="metric-label">Low Stress</div>
            <div className="metric-val">{stats.lowStressCount}</div>
          </div>
        </div>
        <div className="col">
          <div className="metric-card" style={{ '--metric-color': '#f59e0b' }}>
            <div className="metric-label">Medium</div>
            <div className="metric-val">{stats.mediumStressCount}</div>

        </div>
        <div className="col">
          <div className="metric-card" style={{ '--metric-color': '#ef4444' }}>
            <div className="metric-label">High Risk</div>
            <div className="metric-val" style={{ color: '#f87171' }}>{stats.highStressCount}</div>
          </div>
        </div>
      </div>

      <div className="row g-4">
        <div className="col-lg-5">
          <div className="card-glass mb-4">
            <div className="card-glass-header">
              <span>🥧 Cohort Stress Distribution</span>
            </div>
            <div className="card-glass-body" style={{ height: 260 }}>
              <canvas ref={pieRef} />
            </div>
          </div>

          <div className="card-glass">
            <div className="card-glass-header">
              <span>🤖 Model Specifications</span>
            </div>
            <div className="card-glass-body">
              {[
                { label: 'Algorithm', val: 'Random Forest Ensemble', color: '#6366f1' },
                { label: 'Validation Accuracy', val: '88.64%', color: '#10b981' },
                { label: '5-Fold CV Score', val: '87.36%', color: '#06b6d4' },
                { label: 'Average Confidence', val: (stats.averageConfidence || 0).toFixed(1) + '%', color: '#f59e0b' },

                <div key={m.label} className="d-flex justify-content-between py-2" style={{ borderBottom: '1px solid var(--border-subtle)', fontSize: '0.88rem' }}>
                  <span style={{ color: 'var(--text-secondary)' }}>{m.label}</span>
                  <span style={{ fontWeight: 700, color: m.color }}>{m.val}</span>

          </div>
        </div>

        <div className="col-lg-7">
          <div className="card-glass">
            <div className="card-glass-header">
              <span>🕒 Recent Inferences Across All Accounts</span>

// ─── Admin Users Management View ─────────────────────────────────────────────
function AdminUsersView() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');

  useEffect(() => {
    api.get('/admin/users')
      .then(d => { setUsers(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const toggleUser = async (id, active) => {
    await api.put(`/admin/users/${id}`, { active: !active });
    setUsers(u => u.map(x => x.id === id ? { ...x, active: !x.active } : x));
  };

  const deleteUser = async (id) => {
    if (!confirm('Are you sure you want to permanently delete this user and their history?')) return;
    await api.del(`/admin/users/${id}`);
    setUsers(u => u.filter(x => x.id !== id));
  };

  const filtered = users.filter(u =>
    u.username?.toLowerCase().includes(search.toLowerCase()) ||
    u.fullName?.toLowerCase().includes(search.toLowerCase()) ||
    u.email?.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div style={{ padding: '2rem' }}>
      <div className="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
          <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: 0 }}>
            👥 User Management
          </h2>
          <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem' }}>Manage enrolled patients, toggle permissions, and monitor activity.</p>
        </div>
        <input
          className="form-control-modern"
          style={{ width: 260 }}
          placeholder="🔍 Search users..."
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
      </div>

      <div className="card-glass">
        <div className="card-glass-body p-0">
          {loading ? (
            <div style={{ padding: '3rem', textAlign: 'center', color: 'var(--text-muted)' }}>Loading users...</div>
          ) : (
            <table className="table-modern">
              <thead>
                <tr>
                  <th>User Identity</th>
                  <th>Email</th>
                  <th>Predictions</th>
                  <th>Last Stress Level</th>
                  <th>Account Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(u => (
                  <tr key={u.id}>
                    <td>
                      <div style={{ fontWeight: 700 }}>{u.fullName || u.username}</div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>@{u.username}</div>
                    </td>
                    <td>{u.email}</td>
                    <td style={{ fontWeight: 700, color: 'var(--primary-light)' }}>{u.totalPredictions}</td>
                    <td>
                      <span className={`badge-stress ${u.lastStressLabel?.toLowerCase()}`}>
                        {u.lastStressLabel || 'None'}
                      </span>
                    </td>
                    <td>
                      <span className={`badge-stress ${u.active ? 'low' : 'high'}`}>
                        {u.active ? 'Active' : 'Suspended'}
                      </span>
                    </td>
                    <td>
                      <div className="d-flex gap-2">
                        <button className="btn-glass" style={{ padding: '0.35rem 0.6rem' }} onClick={() => toggleUser(u.id, u.active)}>
                          {u.active ? 'Disable' : 'Enable'}
                        </button>
                        <button className="btn-glass" style={{ padding: '0.35rem 0.6rem', color: '#f87171' }} onClick={() => deleteUser(u.id)}>
                          <Icon name="trash" size={14} />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Main Application Component ──────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(() => {
    const saved = localStorage.getItem('user_info');
    return saved ? JSON.parse(saved) : null;
  });
  const [page, setPage] = useState('dashboard');
  const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'dark');
  const [ambientPlaying, setAmbientPlaying] = useState(false);
  const [toast, setToast] = useState('');

  // Toggle Theme
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('app_theme', theme);
  }, [theme]);

  const toggleTheme = () => {
    setTheme(prev => prev === 'dark' ? 'light' : 'dark');
  };

  const toggleAmbient = () => {
    if (ambientPlaying) {
      ambientPlayer.stop();
      setAmbientPlaying(false);
      showToast('🔇 Ambient sound paused');
    } else {
      ambientPlayer.start();
      setAmbientPlaying(true);
      showToast('🌧️ Calming rain ambience active');
    }
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 3000);
  };

  const handleLogin = (u) => {
    setUser(u);
    setPage('dashboard');
    showToast(`Welcome back, ${u.fullName || u.username}!`);
  };

  const handleLogout = () => {
    if (ambientPlaying) ambientPlayer.stop();
    localStorage.clear();
    setUser(null);
  };

  if (!user) return <AuthView onLogin={handleLogin} />;

  const isAdmin = user?.role === 'ADMIN';

  const navItems = [
    { key: 'dashboard', label: 'Dashboard', icon: 'home' },
    { key: 'predict', label: 'New Prediction', icon: 'brain' },
    { key: 'history', label: 'History Archive', icon: 'history' },
    { key: 'profile', label: 'My Profile', icon: 'user' },
  ];

  const adminItems = [
    { key: 'admin-dashboard', label: 'Admin Telemetry', icon: 'chart' },
    { key: 'admin-users', label: 'Manage Users', icon: 'users' },
  ];

  return (
    <div className="app-layout">
      {/* Toast Notification */}
      {toast && (
        <div className="toast-popup">
          <Icon name="sparkles" size={20} color="var(--primary-light)" />
          <span>{toast}</span>
        </div>
      )}

      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-brand">
          <div className="brand-icon">🧠</div>
          <div className="brand-text">
            <h1>StressGuard</h1>
            <span>AI Platform 2.0</span>
          </div>
        </div>

        <div className="sidebar-nav">
          <div className="nav-label">Main Workspace</div>
          {navItems.map(item => (
            <button
              key={item.key}
              className={`nav-btn ${page === item.key ? 'active' : ''}`}
              onClick={() => setPage(item.key)}
            >
              <Icon name={item.icon} size={18} />
              <span>{item.label}</span>
            </button>
          ))}

          {isAdmin && (
            <>
              <div className="nav-label" style={{ marginTop: '1.2rem' }}>Administration</div>
              {adminItems.map(item => (
                <button
                  key={item.key}
                  className={`nav-btn ${page === item.key ? 'active' : ''}`}
                  onClick={() => setPage(item.key)}
                >
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              ))}
            </>
          )}
        </div>

        <div className="sidebar-footer">
          <div className="user-avatar">
            {(user?.fullName || user?.username || 'U')[0].toUpperCase()}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: '0.88rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {user?.fullName || user?.username}
            </div>
            <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
              Role: <span style={{ color: 'var(--secondary)' }}>{user?.role}</span>
            </div>
          </div>
          <button className="btn-icon" onClick={handleLogout} title="Sign Out">
            <Icon name="logout" size={16} />
          </button>
        </div>
      </div>

      {/* Main Content Pane */}
      <div className="main-wrap">
        {/* Topbar */}
        <div className="topbar">
          <div className="topbar-title">
            <span>
              {page === 'dashboard' && '🏠 Dashboard Overview'}
              {page === 'predict' && '🔮 Clinical Prediction Engine'}
              {page === 'history' && '📋 Historical Logs'}
              {page === 'profile' && '👤 User Profile'}
              {page === 'admin-dashboard' && '🛡️ Enterprise Telemetry'}
              {page === 'admin-users' && '👥 User Management'}
            </span>
          </div>

          <div className="topbar-tools">
            {/* Ambient Soundscape Button */}
            <button
              className={`btn-glass ${ambientPlaying ? 'active' : ''}`}
              onClick={toggleAmbient}
              title="Toggle Gentle Rain Soundscape"
              style={{ borderColor: ambientPlaying ? 'var(--secondary)' : 'var(--border-subtle)' }}
            >
              <Icon name={ambientPlaying ? 'volume' : 'volumeMute'} size={16} color={ambientPlaying ? 'var(--secondary)' : 'currentColor'} />
              <span>{ambientPlaying ? 'Rain Sound: ON' : 'Ambient Relief'}</span>
            </button>

            {/* Dark / Light Mode Toggle */}
            <button className="btn-icon" onClick={toggleTheme} title="Toggle Dark / Light Theme">
              <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={17} />
            </button>

            {/* Model Badge */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', padding: '0.35rem 0.85rem', borderRadius: 20, background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-subtle)', fontSize: '0.78rem' }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#10b981', display: 'inline-block' }} />
              <span style={{ fontWeight: 600 }}>Random Forest: 88.6%</span>
            </div>
          </div>
        </div>

        {/* Dynamic Page Component */}
        {page === 'dashboard' && <DashboardView user={user} setPage={setPage} />}
        {page === 'predict' && <PredictionView />}
        {page === 'history' && <HistoryView />}
        {page === 'profile' && <ProfileView user={user} />}
        {page === 'admin-dashboard' && <AdminDashboardView />}
        {page === 'admin-users' && <AdminUsersView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
