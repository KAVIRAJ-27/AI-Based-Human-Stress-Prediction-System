<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StressGuard AI – Stress Prediction System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" integrity="" crossorigin="anonymous" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" integrity="" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" integrity="" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" integrity="" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" integrity="" crossorigin="anonymous"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --secondary: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --sidebar: #1e1b4b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    /* Auth */
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); }
    .auth-card { background: white; border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .auth-logo { font-size: 2rem; font-weight: 800; color: var(--primary); text-align: center; margin-bottom: 0.5rem; }
    .auth-sub { text-align: center; color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }

    /* Layout */
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--sidebar); color: white; flex-shrink: 0; position: fixed;
      top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 100; transition: transform 0.3s; }
    .sidebar-logo { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo h1 { font-size: 1.3rem; font-weight: 800; color: white; }
    .sidebar-logo span { color: #a5b4fc; font-size: 0.75rem; }
    .sidebar-nav { padding: 1rem 0; }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1.5rem; cursor: pointer;
      color: rgba(255,255,255,0.7); transition: all 0.2s; font-size: 0.9rem; border-left: 3px solid transparent; }
    .nav-item:hover { background: rgba(15, 23, 42, 0.95); color: #ffffff; }
    .nav-item.active { background: rgba(30, 41, 59, 0.96); color: #ffffff; border-left-color: #38bdf8; }
    .nav-section { padding: 1rem 1.5rem 0.4rem; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: rgba(255,255,255,0.35); }
    .sidebar-user { padding: 1rem 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 0.75rem; margin-top: auto; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
    .main-content { margin-left: 260px; flex: 1; }
    .topbar { background: white; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .page-content { padding: 1.5rem; }

    /* Cards */
    .card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
    .card-header-custom { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); font-weight: 600; }
    .stat-card { border-radius: 14px; padding: 1.5rem; color: white; }
    .stat-card.purple { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .stat-card.cyan   { background: linear-gradient(135deg, #06b6d4, #0284c7); }
    .stat-card.green  { background: linear-gradient(135deg, #10b981, #059669); }
    .stat-card.orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .stat-card.red    { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .stat-num { font-size: 2rem; font-weight: 800; }
    .stat-label { font-size: 0.8rem; opacity: 0.85; margin-top: 0.25rem; }
    .stat-icon { font-size: 2.5rem; opacity: 0.3; float: right; margin-top: -2.5rem; }

    /* Stress badge */
    .stress-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.9rem;
      border-radius: 20px; font-weight: 600; font-size: 0.8rem; }
    .stress-low    { background: #d1fae5; color: #065f46; }
    .stress-medium { background: #fef3c7; color: #92400e; }
    .stress-high   { background: #fee2e2; color: #991b1b; }

    /* Form */
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 0.3rem; }
    .form-control, .form-select { border-radius: 8px; border: 1px solid var(--border); padding: 0.5rem 0.75rem;
      font-size: 0.85rem; transition: all 0.2s; }
    .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); outline: none; }
    .btn-primary-custom { background: var(--primary); color: white; border: none; border-radius: 10px;
      padding: 0.6rem 1.5rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary-custom:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-outline-custom { background: transparent; color: var(--primary); border: 1.5px solid var(--primary);
      border-radius: 10px; padding: 0.55rem 1.4rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-outline-custom:hover { background: var(--primary); color: white; }

    /* Range slider */
    .range-group { display: flex; align-items: center; gap: 0.75rem; }
    .range-value { min-width: 2.5rem; text-align: center; font-weight: 700; color: var(--primary);
      background: #eef2ff; padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.85rem; }
    input[type=range] { appearance: none; -webkit-appearance: none; height: 6px; border-radius: 3px; background: var(--border); outline: none; flex: 1; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: var(--primary); cursor: pointer; }

    /* Result card */
    .result-card { border-radius: 18px; padding: 2rem; text-align: center; margin-bottom: 1.5rem; }
    .result-card.low    { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
    .result-card.medium { background: linear-gradient(135deg, #fef3c7, #fde68a); }
    .result-card.high   { background: linear-gradient(135deg, #fee2e2, #fecaca); }
    .result-level { font-size: 4rem; font-weight: 900; line-height: 1; }
    .result-level.low    { color: #065f46; }
    .result-level.medium { color: #92400e; }
    .result-level.high   { color: #991b1b; }

    /* Table */
    .table-custom { width: 100%; border-collapse: collapse; }
    .table-custom th { padding: 0.75rem 1rem; background: #f8fafc; font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border-bottom: 1px solid var(--border); }
    .table-custom td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .table-custom tr:last-child td { border-bottom: none; }
    .table-custom tr:hover td { background: #f8fafc; }

    /* Alert */
    .alert-custom { border-radius: 10px; padding: 0.85rem 1rem; display: flex; align-items: flex-start;
      gap: 0.6rem; font-size: 0.85rem; margin-bottom: 0.6rem; }
    .alert-info { background: #eff6ff; color: #1d4ed8; }
    .alert-success { background: #f0fdf4; color: #166534; }
    .alert-warning { background: #fffbeb; color: #92400e; }
    .alert-danger { background: #fef2f2; color: #991b1b; }

    /* Progress bars */
    .progress-bar-custom { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }

    .section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text); }
    .text-muted-custom { color: var(--muted); font-size: 0.83rem; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── API Layer ──────────────────────────────────────────────────────────────
const API_BASE = 'http://localhost:8080/api';

const api = {
  token: () => localStorage.getItem('jwt_token'),
  headers: () => ({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${api.token()}` }),

  async post(path, body, auth=false) {
    try {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: auth ? { 'Content-Type': 'application/json' } : api.headers(),
        body: JSON.stringify(body)
      });
      let data = {};
      const text = await res.text();
      if (text) {
        try { data = JSON.parse(text); } catch { data = { message: text }; }
      }
      if (!res.ok) {
        throw new Error(data.message || data.error || data.path || 'Request failed');
      }
      return data;
    } catch (err) {
      if (err instanceof TypeError && err.message.includes('fetch')) {
        throw new Error('Unable to reach the backend server. Make sure the Spring app is running on localhost:8080.');
      }
      throw err;
    }
  },
  async get(path) {
    const res = await fetch(API_BASE + path, { headers: api.headers() });
    const text = await res.text();
    let data = {};
    if (text) { try { data = JSON.parse(text); } catch { data = { message: text }; } }
    if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
    return data;
  },
  async put(path, body) {
    const res = await fetch(API_BASE + path, { method: 'PUT', headers: api.headers(), body: JSON.stringify(body) });
    const text = await res.text();
    let data = {};
    if (text) { try { data = JSON.parse(text); } catch { data = { message: text }; } }
    if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
    return data;
  },
  async del(path) {
    const res = await fetch(API_BASE + path, { method: 'DELETE', headers: api.headers() });
    if (!res.ok) throw new Error('Delete failed');
  }
};

// ─── Icons (SVG) ────────────────────────────────────────────────────────────
const Icon = ({ name, size=16 }) => {
  const icons = {
    home: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10',
    predict: 'M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V9',
    history: 'M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
    users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
    chart: 'M18 20V10 M12 20V4 M6 20v-6',
    user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
    logout: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9',
    brain: 'M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.14 M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.14',
    shield: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
    alert: 'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01',
    check: 'M20 6L9 17l-5-5',
    trash: 'M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
    edit: 'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z',
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {icons[name]?.split(' M').map((d,i) => <path key={i} d={i===0?d:'M'+d}/>)}
    </svg>
  );
};

// ─── Auth Pages ──────────────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [form, setForm] = useState({ username:'', password:'' });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [isRegister, setIsRegister] = useState(false);
  const [regForm, setRegForm] = useState({ username:'', email:'', password:'', fullName:'', age:'', gender:'' });

  const handleLogin = async (e) => {
    e.preventDefault(); setLoading(true); setError('');
    try {
      const data = await api.post('/auth/login', form, true);
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('user_info', JSON.stringify(data));
      onLogin(data);
    } catch(err) { setError(err.message); }
    setLoading(false);
  };

  const handleRegister = async (e) => {
    e.preventDefault(); setLoading(true); setError('');
    try {
      const payload = { ...regForm, age: parseInt(regForm.age)||null };
      const data = await api.post('/auth/register', payload, true);
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('user_info', JSON.stringify(data));
      onLogin(data);
    } catch(err) { setError(err.message); }
    setLoading(false);
  };

  return (
    <div className="auth-page">
      <div className="auth-card fade-in">
        <div className="auth-logo">🧠 StressGuard AI</div>
        <div className="auth-sub">AI-Powered Human Stress Prediction System</div>

        {error && <div className="alert-custom alert-danger mb-3">⚠️ {error}</div>}

        {!isRegister ? (
          <form onSubmit={handleLogin}>
            <div className="mb-3">
              <label className="form-label">Username</label>
              <input className="form-control" placeholder="Enter username" value={form.username}
                onChange={e=>setForm({...form,username:e.target.value})} required />
            </div>
            <div className="mb-4">
              <label className="form-label">Password</label>
              <input type="password" className="form-control" placeholder="Enter password" value={form.password}
                onChange={e=>setForm({...form,password:e.target.value})} required />
            </div>
            <button type="submit" className="btn-primary-custom w-100" disabled={loading}>
              {loading ? '⏳ Signing in...' : '🔐 Sign In'}
            </button>
            <div className="text-center mt-3" style={{fontSize:'0.85rem', color:'var(--muted)'}}>
              Don't have an account?{' '}
              <span style={{color:'var(--primary)',cursor:'pointer',fontWeight:600}} onClick={()=>{setIsRegister(true);setError('');}}>
                Register here
              </span>
            </div>
            <div className="mt-3 p-3 rounded" style={{background:'#f0f9ff',fontSize:'0.78rem',color:'var(--muted)'}}>
              <strong>Demo:</strong> admin/admin123 (admin) or register a new user
            </div>
          </form>
        ) : (
          <form onSubmit={handleRegister}>
            <div className="row g-2">
              <div className="col-6">
                <label className="form-label">Username *</label>
                <input className="form-control" value={regForm.username} onChange={e=>setRegForm({...regForm,username:e.target.value})} required />
              </div>
              <div className="col-6">
                <label className="form-label">Full Name</label>
                <input className="form-control" value={regForm.fullName} onChange={e=>setRegForm({...regForm,fullName:e.target.value})} />
              </div>
              <div className="col-12">
                <label className="form-label">Email *</label>
                <input type="email" className="form-control" value={regForm.email} onChange={e=>setRegForm({...regForm,email:e.target.value})} required />
              </div>
              <div className="col-6">
                <label className="form-label">Password *</label>
                <input type="password" className="form-control" value={regForm.password} onChange={e=>setRegForm({...regForm,password:e.target.value})} required />
              </div>
              <div className="col-3">
                <label className="form-label">Age</label>
                <input type="number" className="form-control" value={regForm.age} onChange={e=>setRegForm({...regForm,age:e.target.value})} />
              </div>
              <div className="col-3">
                <label className="form-label">Gender</label>
                <select className="form-select" value={regForm.gender} onChange={e=>setRegForm({...regForm,gender:e.target.value})}>
                  <option value="">—</option>
                  <option>Male</option><option>Female</option><option>Other</option>
                </select>
              </div>
            </div>
            <button type="submit" className="btn-primary-custom w-100 mt-3" disabled={loading}>
              {loading ? '⏳ Registering...' : '✅ Create Account'}
            </button>
            <div className="text-center mt-3" style={{fontSize:'0.85rem',color:'var(--muted)'}}>
              Already have an account?{' '}
              <span style={{color:'var(--primary)',cursor:'pointer',fontWeight:600}} onClick={()=>{setIsRegister(false);setError('');}}>
                Sign in
              </span>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar({ user, page, setPage, onLogout }) {
  const isAdmin = user?.role === 'ADMIN';
  const nav = [
    { key:'dashboard', label:'Dashboard', icon:'home' },
    { key:'predict', label:'New Prediction', icon:'predict' },
    { key:'history', label:'My History', icon:'history' },
    { key:'profile', label:'My Profile', icon:'user' },
  ];
  const adminNav = [
    { key:'admin-dashboard', label:'Admin Dashboard', icon:'chart' },
    { key:'admin-users', label:'Manage Users', icon:'users' },
    { key:'admin-predictions', label:'All Predictions', icon:'shield' },
  ];

  return (
    <div className="sidebar">
      <div className="sidebar-logo">
        <h1>🧠 StressGuard</h1>
        <span>AI Prediction System</span>
      </div>
      <div className="sidebar-nav">
        <div className="nav-section">Main Menu</div>
        {nav.map(n => (
          <div key={n.key} className={`nav-item ${page===n.key?'active':''}`} onClick={()=>setPage(n.key)}>
            <Icon name={n.icon} size={17}/> {n.label}
          </div>
        ))}
        {isAdmin && <>
          <div className="nav-section">Administration</div>
          {adminNav.map(n => (
            <div key={n.key} className={`nav-item ${page===n.key?'active':''}`} onClick={()=>setPage(n.key)}>
              <Icon name={n.icon} size={17}/> {n.label}
            </div>
          ))}
        </>}
      </div>
      <div className="sidebar-user">
        <div className="avatar">{(user?.fullName||user?.username||'U')[0].toUpperCase()}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:'0.82rem',fontWeight:600,color:'white',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
            {user?.fullName||user?.username}
          </div>
          <div style={{fontSize:'0.72rem',color:'rgba(255,255,255,0.5)'}}>{user?.role}</div>
        </div>
        <div style={{cursor:'pointer',color:'rgba(255,255,255,0.5)'}} onClick={onLogout} title="Logout">
          <Icon name="logout" size={16}/>
        </div>
      </div>
    </div>
  );
}

// ─── User Dashboard ───────────────────────────────────────────────────────────
function UserDashboard({ user, setPage }) {
  const [data, setData] = useState(null);
  const chartRef = useRef();
  const chartInstance = useRef();

  useEffect(()=>{
    api.get('/predict/dashboard').then(setData).catch(console.error);
  },[]);

  useEffect(()=>{
    if (!data || !chartRef.current) return;
    if (chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(chartRef.current, {
      type:'doughnut',
      data:{
        labels:['Low','Medium','High'],
        datasets:[{
          data:[data.myLowCount||0, data.myMediumCount||0, data.myHighCount||0],
          backgroundColor:['#10b981','#f59e0b','#ef4444'],
          borderWidth:0
        }]
      },
      options:{ plugins:{legend:{position:'bottom'}}, cutout:'65%', responsive:true }
    });
  },[data]);

  const stressColors = { Low:'success', Medium:'warning', High:'danger' };
  const stressEmoji = { Low:'😌', Medium:'😟', High:'😰', 'N/A':'❓' };

  if (!data) return <div className="page-content fade-in"><div className="text-muted-custom">Loading dashboard…</div></div>;

  return (
    <div className="page-content fade-in">
      <h2 className="section-title">👋 Welcome, {user?.fullName||user?.username}!</h2>

      <div className="row g-3 mb-4">
        <div className="col-md-3">
          <div className="stat-card purple">
            <div className="stat-num">{data.totalMyPredictions}</div>
            <div className="stat-label">Total Predictions</div>
          </div>
        </div>
        <div className="col-md-3">
          <div className={`stat-card ${data.latestStressLabel==='Low'?'green':data.latestStressLabel==='High'?'red':'orange'}`}>

];

function PredictionPage() {
  const initVals = FIELDS.reduce((acc,f)=>({...acc,[f.key]: Math.floor((f.min+f.max)/2)})  ,{});
  const [vals, setVals] = useState(initVals);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const chartRef = useRef();
  const chartInst = useRef();

  const handleSubmit = async (e) => {
    e.preventDefault(); setLoading(true); setError(''); setResult(null);
    try {
      const data = await api.post('/predict', vals);
      setResult(data);
    } catch(err) { setError(err.message); }
    setLoading(false);
  };

  useEffect(()=>{
    if (!result || !chartRef.current) return;
    if (chartInst.current) chartInst.current.destroy();
    const p = result.probabilities;
    chartInst.current = new Chart(chartRef.current, {
      type: 'bar',
      data: {
        labels: ['Low Stress','Medium Stress','High Stress'],
        datasets:[{ data:[p.Low, p.Medium, p.High], backgroundColor:['#10b981','#f59e0b','#ef4444'], borderRadius:8 }]
      },
      options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,max:100}}, responsive:true }
    });
  },[result]);

  const level = result?.stressLabel?.toLowerCase();

  return (
    <div className="page-content fade-in">
      <h2 className="section-title">🔮 Stress Level Prediction</h2>
      <p className="text-muted-custom mb-4">Adjust the sliders to match your current physical and mental state. Our AI will analyze your inputs using Random Forest (88.6% accuracy).</p>

      {error && <div className="alert-custom alert-danger mb-3">⚠️ {error}</div>}

      <div className="row g-4">
        <div className="col-lg-7">
          <div className="card">
            <div className="card-header-custom">📋 Enter Your Health Parameters</div>
            <form onSubmit={handleSubmit} style={{padding:'1.5rem'}}>
              <div className="row g-3">
                {FIELDS.map(f=>(
                  <div className="col-md-6" key={f.key}>
                    <label className="form-label">
                      {f.label}
                      <span className="ms-1" style={{fontSize:'0.72rem',color:'var(--muted)'}}>({f.info})</span>
                    </label>
                    <div className="range-group">
                      <input type="range" min={f.min} max={f.max} value={vals[f.key]}
                        onChange={e=>setVals({...vals,[f.key]:parseInt(e.target.value)})}/>
                      <span className="range-value">{vals[f.key]}</span>
                    </div>
                  </div>
                ))}
              </div>
              <div className="mt-4 d-flex gap-3">
                <button type="submit" className="btn-primary-custom" disabled={loading}>
                  {loading ? '⏳ Analyzing...' : '🧠 Predict Stress Level'}
                </button>
                <button type="button" className="btn-outline-custom" onClick={()=>setVals(initVals)}>
                  🔄 Reset
                </button>
              </div>
            </form>
          </div>
        </div>

        <div className="col-lg-5">
          {result ? (
            <div className="fade-in">
              <div className={`result-card ${level}`}>
                <div style={{fontSize:'0.85rem',fontWeight:600,marginBottom:'0.5rem',opacity:0.7}}>STRESS LEVEL</div>
                <div className={`result-level ${level}`}>{result.stressLabel?.toUpperCase()}</div>
                <div style={{marginTop:'0.5rem',fontWeight:600,opacity:0.8}}>Confidence: {result.confidence?.toFixed(1)}%</div>
              </div>

              <div className="card mb-3">
                <div className="card-header-custom">📊 Probability Distribution</div>
                <div style={{padding:'1rem',height:'220px'}}><canvas ref={chartRef}/></div>
              </div>

              <div className="card mb-3">
                <div className="card-header-custom">🔑 Top Contributing Factors</div>
                <div style={{padding:'1rem'}}>
                  {Object.entries(result.topContributingFactors||{}).map(([k,v])=>(
                    <div key={k} className="mb-2">
                      <div className="d-flex justify-content-between mb-1">
                        <span style={{fontSize:'0.8rem',fontWeight:500}}>{k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</span>
                        <span style={{fontSize:'0.8rem',color:'var(--primary)',fontWeight:700}}>{v.toFixed(1)}%</span>
                      </div>
                      <div className="progress-bar-custom">
                        <div className="progress-fill" style={{width:`${Math.min(v*5,100)}%`,background:'var(--primary)'}}/>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="card">
                <div className="card-header-custom">💡 Recommendations</div>
                <div style={{padding:'1rem'}}>
                  {result.recommendations?.map((r,i)=>(
                    <div key={i} className={`alert-custom ${level==='low'?'alert-success':level==='medium'?'alert-warning':'alert-danger'} mb-2`}>
                      {level==='low'?'✅':level==='medium'?'⚠️':'🆘'} {r}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : (
            <div className="card" style={{padding:'3rem',textAlign:'center',color:'var(--muted)'}}>
              <div style={{fontSize:'4rem',marginBottom:'1rem'}}>🧠</div>
              <div style={{fontWeight:600}}>AI Ready to Analyze</div>
              <div style={{fontSize:'0.85rem',marginTop:'0.5rem'}}>Fill in the parameters and click predict</div>
            </div>

        </div>
      </div>
    </div>
  );
}

// ─── Admin Users Page ─────────────────────────────────────────────────────────
function AdminUsers() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');

  useEffect(()=>{
    api.get('/admin/users').then(d=>{ setUsers(d); setLoading(false); }).catch(()=>setLoading(false));
  },[]);

  const toggleUser = async (id, active) => {
    await api.put(`/admin/users/${id}`, { active: !active });
    setUsers(u=>u.map(x=>x.id===id?{...x,active:!x.active}:x));
  };

  const deleteUser = async (id) => {
    if (!confirm('Delete this user?')) return;
    await api.del(`/admin/users/${id}`);
    setUsers(u=>u.filter(x=>x.id!==id));
  };

  const filtered = users.filter(u=>
    u.username?.toLowerCase().includes(search.toLowerCase()) ||
    u.fullName?.toLowerCase().includes(search.toLowerCase()) ||
    u.email?.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div className="page-content fade-in">
      <div className="d-flex justify-content-between align-items-center mb-4">
        <h2 className="section-title mb-0">👥 Manage Users</h2>
        <input className="form-control" style={{width:260}} placeholder="🔍 Search users…" value={search} onChange={e=>setSearch(e.target.value)}/>

      <div className="card">
        {loading ? <div className="p-4 text-muted-custom">Loading…</div> :
          <table className="table-custom">
            <thead><tr><th>User</th><th>Email</th><th>Predictions</th><th>Last Stress</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {filtered.map(u=>(
                <tr key={u.id}>
                  <td>
                    <div style={{fontWeight:600}}>{u.fullName||u.username}</div>
                    <div style={{fontSize:'0.75rem',color:'var(--muted)'}}>@{u.username}</div>
                  </td>
                  <td style={{fontSize:'0.83rem'}}>{u.email}</td>
                  <td style={{fontWeight:700,color:'var(--primary)'}}>{u.totalPredictions}</td>
                  <td><span className={`stress-badge stress-${u.lastStressLabel?.toLowerCase()}`}>{u.lastStressLabel}</span></td>
                  <td>
                    <span style={{fontSize:'0.78rem',padding:'0.2rem 0.6rem',borderRadius:20,background:u.active?'#d1fae5':'#fee2e2',color:u.active?'#065f46':'#991b1b',fontWeight:600}}>
                      {u.active?'Active':'Inactive'}
                    </span>
                  </td>
                  <td>
                    <div className="d-flex gap-2">
                      <button style={{border:'none',background:'none',color:'var(--warning)',cursor:'pointer'}} onClick={()=>toggleUser(u.id,u.active)} title={u.active?'Deactivate':'Activate'}>
                        <Icon name="edit" size={15}/>
                      </button>
                      <button style={{border:'none',background:'none',color:'var(--danger)',cursor:'pointer'}} onClick={()=>deleteUser(u.id)} title="Delete">
                        <Icon name="trash" size={15}/>
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        }
      </div>
    </div>
  );

  });
  const [page, setPage] = useState('dashboard');

  const handleLogin = (data) => { setUser(data); setPage('dashboard'); };
  const handleLogout = () => { localStorage.clear(); setUser(null); };

  if (!user) return <LoginPage onLogin={handleLogin}/>;

  const pageMap = {
    dashboard: <UserDashboard user={user} setPage={setPage}/>,
    predict: <PredictionPage/>,
    history: <HistoryPage/>,
    profile: <ProfilePage user={user}/>,
    'admin-dashboard': <AdminDashboard/>,
    'admin-users': <AdminUsers/>,
    'admin-predictions': <AdminPredictions/>,
  };

  return (
    <div className="app-layout">
      <Sidebar user={user} page={page} setPage={setPage} onLogout={handleLogout}/>
      <div className="main-content">
        <div className="topbar">
          <div style={{fontWeight:600,fontSize:'1rem'}}>
            {page==='dashboard' && '🏠 Dashboard'}
            {page==='predict' && '🔮 New Prediction'}
            {page==='history' && '📋 My History'}
            {page==='profile' && '👤 Profile'}
            {page==='admin-dashboard' && '🛡️ Admin Dashboard'}
            {page==='admin-users' && '👥 Manage Users'}
            {page==='admin-predictions' && '📊 All Predictions'}
          </div>
          <div className="d-flex align-items-center gap-3">
            <span style={{fontSize:'0.8rem',color:'var(--muted)'}}>🤖 Random Forest | 88.6% Accuracy</span>
            <span style={{fontSize:'0.8rem',background:'var(--primary)',color:'white',padding:'0.25rem 0.75rem',borderRadius:20,fontWeight:600}}>{user?.role}</span>
          </div>
        </div>
        {pageMap[page] || pageMap['dashboard']}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
