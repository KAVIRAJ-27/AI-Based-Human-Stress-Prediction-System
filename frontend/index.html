              <input
                type="date"
                className="form-control-modern"
                style={{ padding: '0.35rem 0.6rem', fontSize: '0.78rem', width: 130 }}
                value={startDate}
                onChange={e => setStartDate(e.target.value)}
                title="Start date filter"
              />
              <span>To:</span>
              <input
                type="date"
                className="form-control-modern"
                style={{ padding: '0.35rem 0.6rem', fontSize: '0.78rem', width: 130 }}
                value={endDate}
                onChange={e => setEndDate(e.target.value)}
                title="End date filter"
              />
            </div>

            <div style={{ position: 'relative' }}>
              <input
                className="form-control-modern"
                style={{ width: 190, padding: '0.45rem 0.8rem', fontSize: '0.82rem' }}
                placeholder="🔍 Search ID, tier, date..."
                value={search}
                onChange={e => setSearch(e.target.value)}
              />
            </div>

            {/* Sort Select */}
            <select
              className="form-control-modern"
              style={{ width: 170, padding: '0.45rem 0.8rem', fontSize: '0.82rem' }}
              value={sortBy}
              onChange={e => setSortBy(e.target.value)}
              title="Sort records"
            >
              <option value="date-desc">Newest First</option>
              <option value="date-asc">Oldest First</option>
              <option value="confidence-desc">Highest Confidence</option>
              <option value="confidence-asc">Lowest Confidence</option>
              <option value="stress-desc">Highest Stress (High → Low)</option>
              <option value="stress-asc">Lowest Stress (Low → High)</option>
            </select>

            {/* Clear Filters Button */}
            {isFiltered && (
              <button
                className="btn-glass"
                style={{ padding: '0.45rem 0.8rem', fontSize: '0.78rem', color: 'var(--text-secondary)' }}
                onClick={handleClearFilters}
                title="Reset all filters and search"
              >
                <Icon name="close" size={14} /> Clear Filters
              </button>
            )}
          </div>
        </div>

        {/* Counter Summary Strip */}
        <div style={{ padding: '0.5rem 1.4rem', background: 'rgba(255, 255, 255, 0.015)', borderBottom: '1px solid var(--border-subtle)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.78rem', color: 'var(--text-muted)' }}>
          <span>
            Showing <strong style={{ color: 'var(--text-primary)' }}>{sorted.length}</strong> of {history.length} records
            {isFiltered && ' (filtered)'}
          </span>
          <span style={{ fontSize: '0.75rem' }}>
            💡 Tip: Click any row or &quot;Inspect&quot; to view 20 biomarkers and radar map
          </span>
        </div>

        {/* Card Body / Table / Empty States */}
        <div className="card-glass-body p-0" style={{ overflowX: 'auto' }}>
          {loading ? (
            <div style={{ padding: '3.5rem', textAlign: 'center', color: 'var(--text-muted)' }}>
              <div style={{ fontSize: '1.8rem', marginBottom: '0.5rem' }}>⏳</div>
              <div style={{ fontWeight: 600 }}>Loading clinical history records...</div>
            </div>
          ) : errorMsg ? (
            <div style={{ padding: '3rem', textAlign: 'center' }}>
              <div style={{ color: '#ef4444', marginBottom: '1rem', fontWeight: 600 }}>{errorMsg}</div>
              <button className="btn-glow" onClick={fetchHistory}>
                <Icon name="refresh" size={16} /> Retry
              </button>
            </div>
          ) : history.length === 0 ? (
            /* Clean Empty History State */
            <div style={{ padding: '4rem 2rem', textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.75rem' }}>
              <div style={{ fontSize: '3rem' }}>📋</div>
              <h3 style={{ margin: 0, fontWeight: 700, fontSize: '1.25rem' }}>No Clinical Assessment Records</h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.88rem', maxWidth: 440, margin: 0 }}>
                You haven&apos;t completed any stress assessments yet. Take your first assessment to record all 20 clinical biomarkers and establish your personal baseline.
              </p>
              <button
                className="btn-glow"
                style={{ marginTop: '0.75rem' }}
                onClick={() => setPage && setPage('predict')}
              >
                <Icon name="brain" size={16} /> Take Clinical Assessment
              </button>
            </div>
          ) : sorted.length === 0 ? (
            /* Filtered Empty State */
            <div style={{ padding: '3.5rem 2rem', textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.75rem' }}>
              <div style={{ fontSize: '2.5rem' }}>🔍</div>
              <h4 style={{ margin: 0, fontWeight: 600 }}>No Matching Records Found</h4>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', maxWidth: 380, margin: 0 }}>
                No predictions match your current search query or active filter settings.
              </p>
              <button className="btn-glass" onClick={handleClearFilters} style={{ marginTop: '0.5rem' }}>
                Reset Filters
              </button>
            </div>
          ) : (
            /* Populated Table with 20 Biomarker Preview */
            <table className="table-modern" style={{ width: '100%', minWidth: 700 }}>
              <thead>
                <tr>
                  <th>#ID</th>
                  <th>Recorded Timestamp</th>
                  <th>Classification</th>
                  <th>Model Confidence</th>
                  <th>Biomarkers Preview</th>

                </tr>

              <tbody>
                {sorted.map(h => {

                  return (
                    <tr
                      key={h.id}
                      className="history-row"
                      onClick={() => setSelectedRecord(h)}
                      title={`Click to inspect complete 20 biomarkers for prediction #${h.id}`}

                          </div>

                            <span style={{ fontSize: '0.72rem', padding: '0.15rem 0.45rem', borderRadius: 4, background: 'rgba(99, 102, 241, 0.15)', color: '#a5b4fc', fontFamily: 'monospace' }}>
                              Anx: {h.anxietyLevel}
                            </span>
                          )}
                          {h.sleepQuality != null && (
                            <span style={{ fontSize: '0.72rem', padding: '0.15rem 0.45rem', borderRadius: 4, background: 'rgba(16, 185, 129, 0.15)', color: '#6ee7b7', fontFamily: 'monospace' }}>
                              Sleep: {h.sleepQuality}
                            </span>
                          )}
                          {h.depression != null && (
                            <span style={{ fontSize: '0.72rem', padding: '0.15rem 0.45rem', borderRadius: 4, background: 'rgba(239, 68, 68, 0.15)', color: '#fca5a5', fontFamily: 'monospace' }}>

      </div>

      {/* Telemetry Detail Modal */}
      {selectedRecord && (
        <PredictionDetailModal
          record={selectedRecord}
          onClose={() => setSelectedRecord(null)}
          onExportSingle={(rec) => exportRecordsToCSV([rec], `stressguard_record_${rec.id}.csv`)}

    </div>
  );
}

// ─── Profile View ────────────────────────────────────────────────────────────
function ProfileView({ user, onUserUpdated }) {
  const [form, setForm] = useState({
    fullName: user?.fullName || '',
    email: user?.email || '',
    phone: '',
    age: user?.age || '',
    gender: user?.gender || ''
  });
  const [profileData, setProfileData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [successMsg, setSuccessMsg] = useState('');
  const [errorMsg, setErrorMsg] = useState('');

  // Load authenticated profile from database on mount
  useEffect(() => {
    let isMounted = true;
    setLoading(true);
    setErrorMsg('');
    api.get('/user/profile')
      .then(p => {
        if (!isMounted) return;
        setProfileData(p);
        setForm({
          fullName: p.fullName || '',
          email: p.email || '',
          phone: p.phone || '',
          age: p.age !== null && p.age !== undefined ? p.age : '',
          gender: p.gender || ''
        });
        setLoading(false);
      })
      .catch(err => {
        if (!isMounted) return;
        setErrorMsg(err.message || 'Unable to load profile data from server.');
        setLoading(false);
      });
    return () => { isMounted = false; };
  }, []);

  const handleSave = async (e) => {
    e.preventDefault();
    if (saving) return;

    if (!form.email || !form.email.trim()) {
      setErrorMsg('Email address cannot be empty.');
      return;
    }
    if (form.age !== '' && (parseInt(form.age, 10) < 1 || parseInt(form.age, 10) > 130)) {
      setErrorMsg('Age must be between 1 and 130.');
      return;
    }

    setSaving(true);
    setErrorMsg('');
    setSuccessMsg('');

    try {
      const payload = {
        fullName: form.fullName.trim(),
        email: form.email.trim(),
        phone: form.phone.trim(),
        age: form.age !== '' ? parseInt(form.age, 10) : null,
        gender: form.gender
      };

      const updated = await api.put('/user/profile', payload);
      setProfileData(updated);
      setForm({
        fullName: updated.fullName || '',
        email: updated.email || '',
        phone: updated.phone || '',
        age: updated.age !== null && updated.age !== undefined ? updated.age : '',
        gender: updated.gender || ''
      });
      setSuccessMsg('Profile updated successfully in database!');
      setTimeout(() => setSuccessMsg(''), 4000);

      if (onUserUpdated) {
        onUserUpdated(updated);
      }
    } catch(err) {
      setErrorMsg(err.message || 'Failed to update profile. Please verify your fields.');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div style={{ padding: '2rem' }}>
      <div className="mb-4">
        <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: 0 }}>
          👤 User Settings & Profile
        </h2>
        <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem' }}>Manage your clinical profile attributes and authorization role.</p>
      </div>

      {successMsg && (
        <div style={{ padding: '0.9rem 1.2rem', borderRadius: 14, background: 'var(--success-bg)', border: '1px solid var(--success)', color: '#34d399', marginBottom: '1.5rem', fontSize: '0.88rem' }}>
          ✅ {successMsg}
        </div>
      )}

      {errorMsg && (
        <div style={{ padding: '0.9rem 1.2rem', borderRadius: 14, background: 'var(--danger-bg)', border: '1px solid var(--danger)', color: '#f87171', marginBottom: '1.5rem', fontSize: '0.88rem' }}>
          ⚠️ {errorMsg}
        </div>
      )}

      <div className="row g-4">
        <div className="col-md-4">
          <div className="card-glass" style={{ padding: '2rem', textAlign: 'center' }}>
            <div className="user-avatar" style={{ width: 80, height: 80, fontSize: '2rem', margin: '0 auto 1rem' }}>
              {((profileData?.fullName || user?.fullName || user?.username || 'U')[0]).toUpperCase()}
            </div>
            <h4 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, margin: 0 }}>
              {profileData?.fullName || user?.fullName || user?.username}
            </h4>
            <div style={{ color: 'var(--text-muted)', fontSize: '0.86rem', marginTop: '0.2rem' }}>
              {profileData?.email || user?.email}
            </div>
            <div className="mt-3">
              <span className={`badge-stress ${((profileData?.role || user?.role) === 'ADMIN') ? 'high' : 'low'}`} style={{ fontSize: '0.82rem' }}>
                Role: {profileData?.role || user?.role}
              </span>
            </div>

            {profileData && (
              <div style={{ marginTop: '1.2rem', padding: '0.9rem', borderRadius: 12, background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-subtle)', fontSize: '0.8rem', color: 'var(--text-secondary)', textAlign: 'left', lineHeight: 1.6 }}>
                <div><strong>Username:</strong> {profileData.username}</div>
                <div><strong>Total Assessments:</strong> {profileData.totalPredictions}</div>
                <div><strong>Last Stress Tier:</strong> {profileData.lastStressLabel || 'None'}</div>
              </div>
            )}
          </div>
        </div>

        <div className="col-md-8">
          <div className="card-glass">
            <div className="card-glass-header">
              <span>Personal Medical Demographics</span>
              {loading && <span style={{ fontSize: '0.78rem', color: 'var(--primary-light)' }}>⏳ Syncing with Cloud...</span>}
            </div>
            <div className="card-glass-body">
              <form onSubmit={handleSave} noValidate>
                <div className="row g-3">
                  <div className="col-md-6">
                    <label style={{ fontSize: '0.82rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.35rem', display: 'block' }}>Full Legal Name</label>
                    <input className="form-control-modern" value={form.fullName} onChange={e => setForm({ ...form, fullName: e.target.value })} disabled={saving || loading} />
                  </div>
                  <div className="col-md-6">
                    <label style={{ fontSize: '0.82rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.35rem', display: 'block' }}>Email Address *</label>
                    <input type="email" className="form-control-modern" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} required disabled={saving || loading} />
                  </div>
                  <div className="col-md-6">
                    <label style={{ fontSize: '0.82rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.35rem', display: 'block' }}>Contact Phone</label>
                    <input className="form-control-modern" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} placeholder="e.g. +1 555-0199" disabled={saving || loading} />
                  </div>
                  <div className="col-md-3">
                    <label style={{ fontSize: '0.82rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.35rem', display: 'block' }}>Age</label>
                    <input type="number" min="1" max="130" className="form-control-modern" value={form.age} onChange={e => setForm({ ...form, age: e.target.value })} disabled={saving || loading} />
                  </div>
                  <div className="col-md-3">
                    <label style={{ fontSize: '0.82rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.35rem', display: 'block' }}>Gender</label>
                    <select className="form-control-modern" value={form.gender} onChange={e => setForm({ ...form, gender: e.target.value })} disabled={saving || loading}>
                      <option value="">—</option>
                      <option>Male</option><option>Female</option><option>Other</option>
                    </select>
                  </div>
                </div>
                <button type="submit" className="btn-glow mt-4" disabled={saving || loading}>
                  {saving ? '⏳ Saving to Database...' : '💾 Update Profile'}
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Admin Users Management View ─────────────────────────────────────────────
function AdminUsersView() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');

  useEffect(() => {
    api.get('/admin/users')
      .then(d => { setUsers(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const toggleUser = async (id, active) => {
    await api.put(`/admin/users/${id}`, { active: !active });
    setUsers(u => u.map(x => x.id === id ? { ...x, active: !x.active } : x));
  };

  const deleteUser = async (id) => {
    if (!confirm('Are you sure you want to permanently delete this user and their history?')) return;
    await api.del(`/admin/users/${id}`);
    setUsers(u => u.filter(x => x.id !== id));
  };

  const filtered = users.filter(u =>
    u.username?.toLowerCase().includes(search.toLowerCase()) ||
    u.fullName?.toLowerCase().includes(search.toLowerCase()) ||
    u.email?.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div style={{ padding: '2rem' }}>
      <div className="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
          <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: 0 }}>
            👥 User Management
          </h2>
          <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem' }}>Manage enrolled patients, toggle permissions, and monitor activity.</p>
        </div>
        <input
          className="form-control-modern"
          style={{ width: 260 }}
          placeholder="🔍 Search users..."
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
      </div>

      <div className="card-glass">
        <div className="card-glass-body p-0">
          {loading ? (
            <div style={{ padding: '3rem', textAlign: 'center', color: 'var(--text-muted)' }}>Loading users...</div>
          ) : (
            <table className="table-modern">
              <thead>
                <tr>
                  <th>User Identity</th>
                  <th>Email</th>
                  <th>Predictions</th>
                  <th>Last Stress Level</th>
                  <th>Account Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(u => (
                  <tr key={u.id}>
                    <td>
                      <div style={{ fontWeight: 700 }}>{u.fullName || u.username}</div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>@{u.username}</div>
                    </td>
                    <td>{u.email}</td>
                    <td style={{ fontWeight: 700, color: 'var(--primary-light)' }}>{u.totalPredictions}</td>
                    <td>
                      <span className={`badge-stress ${u.lastStressLabel?.toLowerCase()}`}>
                        {u.lastStressLabel || 'None'}
                      </span>
                    </td>
                    <td>
                      <span className={`badge-stress ${u.active ? 'low' : 'high'}`}>
                        {u.active ? 'Active' : 'Suspended'}
                      </span>
                    </td>
                    <td>
                      <div className="d-flex gap-2">
                        <button className="btn-glass" style={{ padding: '0.35rem 0.6rem' }} onClick={() => toggleUser(u.id, u.active)}>
                          {u.active ? 'Disable' : 'Enable'}
                        </button>
                        <button className="btn-glass" style={{ padding: '0.35rem 0.6rem', color: '#f87171' }} onClick={() => deleteUser(u.id)}>
                          <Icon name="trash" size={14} />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Main Application Component ──────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(() => {
    const saved = localStorage.getItem('user_info');
    return saved ? JSON.parse(saved) : null;
  });

  const parseRoute = (hash, currentUser) => {
    const clean = (hash || '').replace(/^#\/?/, '').trim();
    const userPages = ['dashboard', 'predict', 'history', 'profile'];
    const adminPages = ['admin-dashboard', 'admin-users'];
    if (userPages.includes(clean)) return clean;
    if (adminPages.includes(clean)) {
      return currentUser?.role === 'ADMIN' ? clean : 'dashboard';
    }
    return 'dashboard';
  };

  const [page, setPage] = useState(() => {
    const savedUser = localStorage.getItem('user_info');
    const u = savedUser ? JSON.parse(savedUser) : null;
    return parseRoute(window.location.hash, u);
  });

  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'dark');
  const [ambientPlaying, setAmbientPlaying] = useState(false);
  const [toast, setToast] = useState('');

  // Synchronize browser history and hash routing
  useEffect(() => {
    if (!user) return;

    const syncRouteFromHash = () => {
      const targetPage = parseRoute(window.location.hash, user);
      setPage(targetPage);
      const expectedHash = '#/' + targetPage;
      if (window.location.hash !== expectedHash) {
        window.history.replaceState(null, '', expectedHash);
      }
    };

    syncRouteFromHash();
    window.addEventListener('hashchange', syncRouteFromHash);
    return () => window.removeEventListener('hashchange', syncRouteFromHash);
  }, [user]);

  // Close sidebar on Escape key
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'Escape' && sidebarOpen) {
        setSidebarOpen(false);
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [sidebarOpen]);

  // Lock body scroll when mobile drawer is open
  useEffect(() => {
    if (sidebarOpen) {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
    }
    return () => {
      document.body.style.overflow = '';
    };
  }, [sidebarOpen]);

  // Auto-close mobile drawer on window resize to desktop
  useEffect(() => {
    const handleResize = () => {
      if (window.innerWidth > 992 && sidebarOpen) {
        setSidebarOpen(false);
      }
    };
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, [sidebarOpen]);

  const navigateTo = (targetPage) => {
    let validPage = targetPage;
    if ((targetPage === 'admin-dashboard' || targetPage === 'admin-users') && user?.role !== 'ADMIN') {
      validPage = 'dashboard';
    }
    const targetHash = '#/' + validPage;
    if (window.location.hash !== targetHash) {
      window.location.hash = targetHash;
    } else {
      setPage(validPage);
    }
    if (sidebarOpen) setSidebarOpen(false);
  };

  // Toggle Theme
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('app_theme', theme);
  }, [theme]);

  const toggleTheme = () => {
    setTheme(prev => prev === 'dark' ? 'light' : 'dark');
  };

  const toggleAmbient = () => {
    if (ambientPlaying) {
      ambientPlayer.stop();
      setAmbientPlaying(false);
      showToast('🔇 Ambient sound paused');
    } else {
      ambientPlayer.start();
      setAmbientPlaying(true);
      showToast('🌧️ Calming rain ambience active');
    }
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 3000);
  };

  const handleUserUpdated = (updatedProfile) => {
    setUser(prev => {
      const nextUser = {
        ...prev,
        fullName: updatedProfile.fullName,
        email: updatedProfile.email
      };
      localStorage.setItem('user_info', JSON.stringify(nextUser));
      return nextUser;
    });
    showToast('Profile updated in session!');
  };

  const handleLogin = (u) => {
    setUser(u);
    navigateTo('dashboard');
    showToast(`Welcome back, ${u.fullName || u.username}!`);
  };

  const handleLogout = () => {
    if (ambientPlaying) ambientPlayer.stop();
    localStorage.clear();
    setUser(null);
    setSidebarOpen(false);
    window.location.hash = '#/login';
  };

  if (!user) return <AuthView onLogin={handleLogin} />;

  const isAdmin = user?.role === 'ADMIN';

  const navItems = [
    { key: 'dashboard', label: 'Dashboard', icon: 'home' },
    { key: 'predict', label: 'New Prediction', icon: 'brain' },
    { key: 'history', label: 'History Archive', icon: 'history' },
    { key: 'profile', label: 'My Profile', icon: 'user' },
  ];

  const adminItems = [
    { key: 'admin-dashboard', label: 'Admin Telemetry', icon: 'chart' },
    { key: 'admin-users', label: 'Manage Users', icon: 'users' },
  ];

  return (
    <div className="app-layout">
      {/* Toast Notification */}
      {toast && (
        <div className="toast-popup">
          <Icon name="sparkles" size={20} color="var(--primary-light)" />
          <span>{toast}</span>
        </div>
      )}

      {/* Mobile Backdrop Overlay */}
      <div
        className={`sidebar-backdrop ${sidebarOpen ? 'active' : ''}`}
        onClick={() => setSidebarOpen(false)}
        aria-hidden="true"
      />

      {/* Sidebar */}
      <div
        id="app-sidebar"
        className={`sidebar ${sidebarOpen ? 'open' : ''}`}
        role="navigation"
        aria-label="Sidebar Navigation"
      >
        <div className="sidebar-brand">
          <div className="brand-icon">🧠</div>
          <div className="brand-text">
            <h1>StressGuard</h1>
            <span>AI Platform 2.0</span>
          </div>
          <button
            className="btn-icon sidebar-close-btn"
            onClick={() => setSidebarOpen(false)}
            aria-label="Close navigation menu"
            title="Close Menu"
          >
            <Icon name="close" size={18} />
          </button>
        </div>

        <div className="sidebar-nav">
          <div className="nav-label">Main Workspace</div>
          {navItems.map(item => (
            <button
              key={item.key}
              className={`nav-btn ${page === item.key ? 'active' : ''}`}
              onClick={() => navigateTo(item.key)}
            >
              <Icon name={item.icon} size={18} />
              <span>{item.label}</span>
            </button>
          ))}

          {isAdmin && (
            <>
              <div className="nav-label" style={{ marginTop: '1.2rem' }}>Administration</div>
              {adminItems.map(item => (
                <button
                  key={item.key}
                  className={`nav-btn ${page === item.key ? 'active' : ''}`}
                  onClick={() => navigateTo(item.key)}
                >
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              ))}
            </>
          )}
        </div>

        <div className="sidebar-footer">
          <div className="user-avatar">
            {(user?.fullName || user?.username || 'U')[0].toUpperCase()}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: '0.88rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {user?.fullName || user?.username}
            </div>
            <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
              Role: <span style={{ color: 'var(--secondary)' }}>{user?.role}</span>
            </div>
          </div>
          <button className="btn-icon" onClick={handleLogout} title="Sign Out">
            <Icon name="logout" size={16} />
          </button>
        </div>
      </div>

      {/* Main Content Pane */}
      <div className="main-wrap">
        {/* Topbar */}
        <div className="topbar">
          <div className="topbar-title">
            <button
              className="btn-icon hamburger-btn"
              onClick={() => setSidebarOpen(prev => !prev)}
              aria-label="Open navigation menu"
              aria-expanded={sidebarOpen}
              aria-controls="app-sidebar"
              title="Open Navigation Menu"
            >
              <Icon name="menu" size={20} />
            </button>
            <span className="topbar-title-text">
              {page === 'dashboard' && '🏠 Dashboard Overview'}
              {page === 'predict' && '🔮 Clinical Prediction Engine'}
              {page === 'history' && '📋 Historical Logs'}
              {page === 'profile' && '👤 User Profile'}
              {page === 'admin-dashboard' && '🛡️ Enterprise Telemetry'}
              {page === 'admin-users' && '👥 User Management'}
            </span>
          </div>

          <div className="topbar-tools">
            {/* Ambient Soundscape Button */}
            <button
              className={`btn-glass ${ambientPlaying ? 'active' : ''}`}
              onClick={toggleAmbient}
              title="Toggle Gentle Rain Soundscape"
              style={{ borderColor: ambientPlaying ? 'var(--secondary)' : 'var(--border-subtle)' }}
            >
              <Icon name={ambientPlaying ? 'volume' : 'volumeMute'} size={16} color={ambientPlaying ? 'var(--secondary)' : 'currentColor'} />
              <span className="ambient-btn-text">{ambientPlaying ? 'Rain Sound: ON' : 'Ambient Relief'}</span>
            </button>

            {/* Dark / Light Mode Toggle */}
            <button className="btn-icon" onClick={toggleTheme} title="Toggle Dark / Light Theme">
              <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={17} />
            </button>

            {/* Model Badge */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', padding: '0.35rem 0.85rem', borderRadius: 20, background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-subtle)', fontSize: '0.78rem' }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#10b981', display: 'inline-block' }} />
              <span className="model-badge-text" style={{ fontWeight: 600 }}>Random Forest: 88.6%</span>
            </div>

            {/* Cloud Backend Indicator & Config Pill */}
            <div
              onClick={() => {
                const current = localStorage.getItem('api_endpoint') || getApiBase();
                const next = prompt('Backend API Endpoint URL:\n(Leave empty to use default cloud backend)', current);
                if (next !== null) {
                  if (next.trim()) {
                    localStorage.setItem('api_endpoint', next.trim());
                  } else {
                    localStorage.removeItem('api_endpoint');
                  }
                  window.location.reload();
                }
              }}
              style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', padding: '0.35rem 0.85rem', borderRadius: 20, background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-subtle)', fontSize: '0.78rem', cursor: 'pointer' }}
              title="Click to configure backend API endpoint"
            >
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#6366f1', display: 'inline-block' }} />
              <span className="api-pill-text" style={{ fontWeight: 600 }}>API: Cloud</span>
            </div>
          </div>
        </div>

        {/* Dynamic Page Component */}
        {page === 'dashboard' && <DashboardView user={user} setPage={navigateTo} />}
        {page === 'predict' && <PredictionView />}
        {page === 'history' && <HistoryView setPage={navigateTo} />}
        {page === 'profile' && <ProfileView user={user} onUserUpdated={handleUserUpdated} />}
        {page === 'admin-dashboard' && <AdminDashboardView />}
        {page === 'admin-users' && <AdminUsersView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
