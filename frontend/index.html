<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StressGuard AI 2.0 – Clinical Intelligence & Stress Prediction</title>
  
  <!-- Modern Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Bootstrap 5 & Chart.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

  <style>
    /* =========================================================================
       ULTRA-PREMIUM DESIGN SYSTEM & THEME TOKENS
       ========================================================================= */
    :root {
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-heading: 'Outfit', 'Plus Jakarta Sans', sans-serif;

      /* Dark Theme (Default) */
      --bg-base: #070913;
      --bg-surface: rgba(15, 23, 42, 0.72);
      --bg-surface-elevated: rgba(30, 41, 59, 0.65);
      --bg-card: rgba(18, 24, 43, 0.65);
      --bg-card-hover: rgba(28, 38, 68, 0.8);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.35);
      --border-glow: rgba(99, 102, 241, 0.5);

      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      /* Brand Accents */
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-dark: #4338ca;
      --primary-glow: rgba(99, 102, 241, 0.35);

      --secondary: #06b6d4;
      --secondary-glow: rgba(6, 182, 212, 0.35);

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-glow: rgba(16, 185, 129, 0.3);

      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-glow: rgba(245, 158, 11, 0.3);

      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-glow: rgba(239, 68, 68, 0.3);

      --glass-blur: blur(24px) saturate(190%);
      --card-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-subtle);
      --topbar-h: 70px;
      --sidebar-w: 270px;
    }

    /* Light Theme Overrides */
    [data-theme="light"] {
      --bg-base: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --bg-surface-elevated: rgba(255, 255, 255, 0.95);
      --bg-card: rgba(255, 255, 255, 0.8);
      --bg-card-hover: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(148, 163, 184, 0.2);
      --border-accent: rgba(99, 102, 241, 0.4);
      --border-glow: rgba(99, 102, 241, 0.3);

      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --card-shadow: 0 12px 30px -4px rgba(99, 102, 241, 0.12), 0 0 0 1px var(--border-subtle);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: var(--font-body); color: var(--text-main); background: var(--bg-base); transition: background-color 0.3s ease, color 0.3s ease; overflow-x: hidden; }

    /* Animated Ambient Orb Backdrops */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.28;
      animation: floatOrb 22s ease-in-out infinite alternate;
    }
    .orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, #6366f1, #3b82f6); top: -120px; left: -100px; animation-duration: 25s; }
    .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #06b6d4, #10b981); bottom: -80px; right: -80px; animation-duration: 20s; }
    .orb-3 { width: 400px; height: 400px; background: radial-gradient(circle, #ec4899, #8b5cf6); top: 40%; left: 35%; animation-duration: 28s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-30px, 40px) scale(0.95); }
    }

    #root { position: relative; z-index: 1; }

    /* Layout */
    .app-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--border-subtle);
      position: fixed;
      top: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-brand {
      padding: 1.5rem 1.4rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: 0.75rem;
    }
    .brand-icon {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px var(--primary-glow);
      color: white; font-size: 1.4rem;
    }
    .brand-text h1 {
      font-family: var(--font-heading);
      font-size: 1.22rem; font-weight: 800; margin: 0;
      background: linear-gradient(135deg, #ffffff, #c7d2fe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    [data-theme="light"] .brand-text h1 {
      background: linear-gradient(135deg, #1e1b4b, #4338ca);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-text span {
      font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--secondary); font-weight: 700;
    }

    .sidebar-nav { padding: 1.2rem 0.9rem; flex: 1; overflow-y: auto; }
    .nav-label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-muted); padding: 0.8rem 0.9rem 0.35rem; font-weight: 700;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 0.85rem;
      width: 100%; padding: 0.72rem 1rem; margin-bottom: 0.3rem;
      border-radius: 12px; border: 1px solid transparent;
      background: transparent; color: var(--text-secondary);
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }
    .nav-btn:hover {
      background: var(--border-subtle); color: var(--text-main);
      transform: translateX(3px);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(168, 85, 247, 0.15));
      border-color: var(--border-accent);
      color: #fff; box-shadow: 0 4px 20px var(--primary-glow);
    }
    [data-theme="light"] .nav-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.14), rgba(168, 85, 247, 0.08));
      color: var(--primary-dark);
    }

    .sidebar-footer {
      padding: 1rem 1.1rem;
      border-top: 1px solid var(--border-subtle);
      background: rgba(0,0,0,0.1);
      display: flex; align-items: center; gap: 0.8rem;
    }
    .user-avatar {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white; font-weight: 700; display: flex;
      align-items: center; justify-content: center; font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    /* Main Area */
    .main-wrap { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }
    
    /* Topbar */
    .topbar {
      height: var(--topbar-h);
      padding: 0 2rem;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 90;
    }
    .topbar-title {
      font-family: var(--font-heading);
      font-size: 1.25rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .topbar-tools { display: flex; align-items: center; gap: 0.85rem; }

    /* Glass Cards */
    .card-glass {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      transition: border-color 0.25s ease, transform 0.2s ease;
      overflow: hidden;
    }
    .card-glass:hover { border-color: var(--border-accent); }
    .card-glass-header {
      padding: 1.25rem 1.6rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-heading); font-weight: 700; font-size: 1.05rem;
    }
    .card-glass-body { padding: 1.6rem; }

    /* Stat Cards */
    .metric-card {
      padding: 1.4rem 1.5rem;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .metric-card:hover { transform: translateY(-3px); }
    .metric-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: var(--metric-color, var(--primary));
    }
    .metric-val {
      font-family: var(--font-heading);
      font-size: 2.1rem; font-weight: 800; line-height: 1.1; margin-top: 0.4rem;
    }
    .metric-label {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 700;
    }
    .metric-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.72rem; padding: 0.2rem 0.55rem; border-radius: 20px;
      font-weight: 700; margin-top: 0.6rem;
    }

    /* Buttons */
    .btn-glow {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff; font-weight: 700; font-size: 0.9rem;
      padding: 0.65rem 1.5rem; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 6px 22px var(--primary-glow);
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-glow:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-2px); box-shadow: 0 8px 26px var(--primary-glow);
      color: #fff;
    }
    .btn-glow:active { transform: translateY(0); }

    .btn-glass {
      background: var(--bg-surface-elevated);
      color: var(--text-main); font-weight: 600; font-size: 0.86rem;
      padding: 0.55rem 1.1rem; border-radius: 12px;
      border: 1px solid var(--border-subtle);
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 0.45rem;
    }
    .btn-glass:hover {
      border-color: var(--border-accent); background: var(--bg-card-hover);
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary); display: flex;
      align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-icon:hover { border-color: var(--border-accent); color: var(--text-main); }

    /* Category Pill Selector */
    .category-tabs {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .cat-tab {
      padding: 0.55rem 1.15rem; border-radius: 14px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary); font-size: 0.86rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .cat-tab:hover { color: var(--text-main); border-color: var(--border-accent); }
    .cat-tab.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(6, 182, 212, 0.2));
      border-color: var(--primary-light); color: var(--text-main);
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    /* Sliders & Direct Numeric Inputs */
    .slider-card, .biomarker-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px; padding: 1.1rem 1.25rem;
      transition: all 0.2s ease;
      position: relative;
    }
    .slider-card:hover, .biomarker-card:hover { border-color: var(--border-accent); }
    .biomarker-card.has-error {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.05);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
    }
    .slider-header, .biomarker-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 0.75rem; gap: 0.75rem;
    }
    .biomarker-title-wrap {
      flex: 1; min-width: 0;
    }
    .slider-title, .biomarker-title {
      font-weight: 600; font-size: 0.9rem; color: var(--text-main);
      display: flex; align-items: center; gap: 0.4rem; line-height: 1.35;
    }
    .slider-hint, .biomarker-hint {
      font-size: 0.74rem; color: var(--text-muted); margin-top: 0.2rem; line-height: 1.35;
    }
    .biomarker-input-wrap {
      display: flex; align-items: center; gap: 0.45rem; flex-shrink: 0;
    }
    .biomarker-input-label {
      font-size: 0.76rem; color: var(--text-secondary); font-weight: 600;
    }
    .biomarker-num-input {
      font-family: var(--font-heading);
      font-weight: 700; font-size: 1rem; width: 68px; height: 38px;
      text-align: center; border-radius: 9px;
      background: rgba(15, 23, 42, 0.85); color: var(--primary-light);
      border: 1px solid var(--border-accent);
      outline: none; transition: all 0.2s ease;
      -moz-appearance: textfield; padding: 0 0.3rem;
    }
    .biomarker-num-input::-webkit-outer-spin-button,
    .biomarker-num-input::-webkit-inner-spin-button {
      -webkit-appearance: inner-spin-button;
      opacity: 0.7;
    }
    .biomarker-num-input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(30, 41, 59, 0.95);
      color: #ffffff;
    }
    .biomarker-num-input.is-invalid {
      border-color: #ef4444 !important;
      color: #f87171 !important;
      background: rgba(239, 68, 68, 0.12) !important;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3) !important;
    }
    .biomarker-track-container {
      position: relative; margin: 0.6rem 0 0.25rem;
    }
    .biomarker-slider, input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 8px; border-radius: 6px;
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.3) 0%, rgba(6, 182, 212, 0.3) 100%);
      outline: none; margin: 0.4rem 0; cursor: pointer;
      transition: background 0.2s ease;
    }
    .biomarker-slider:focus-visible, input[type="range"]:focus-visible {
      outline: 2px solid var(--primary-light);
      outline-offset: 3px;
    }
    .biomarker-slider::-webkit-slider-thumb, input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      cursor: grab; box-shadow: 0 0 12px var(--primary), 0 2px 5px rgba(0,0,0,0.4);
      border: 2px solid #ffffff; transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .biomarker-slider::-webkit-slider-thumb:hover, input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2); box-shadow: 0 0 16px var(--primary-light);
    }
    .biomarker-slider::-webkit-slider-thumb:active, input[type="range"]::-webkit-slider-thumb:active {
      cursor: grabbing; transform: scale(1.1);
    }
    .biomarker-slider::-moz-range-thumb, input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      cursor: grab; border: 2px solid #ffffff; box-shadow: 0 0 12px var(--primary);
    }
    .biomarker-scale-labels {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.72rem; color: var(--text-muted); margin-top: 0.3rem; padding: 0 0.15rem;
    }
    .biomarker-scale-labels .min-tag,
    .biomarker-scale-labels .max-tag {
      font-family: var(--font-heading); font-weight: 600; color: var(--text-secondary);
    }
    .biomarker-scale-labels .unit-tag {
      font-size: 0.7rem; color: var(--text-muted);
    }
    .biomarker-error-msg {
      font-size: 0.78rem; color: #f87171; margin-top: 0.5rem;
      display: flex; align-items: center; gap: 0.35rem; font-weight: 500;
      animation: fadeIn 0.18s ease-in-out;
    }
    .domain-error-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; border-radius: 9px;
      background: #ef4444; color: #ffffff; font-size: 0.68rem; font-weight: 700;
      padding: 0 0.3rem; margin-left: 0.35rem;
    }
    .slider-val-badge {
      font-family: var(--font-heading);
      font-weight: 700; font-size: 0.95rem; min-width: 38px; text-align: center;
      padding: 0.15rem 0.55rem; border-radius: 8px;
      background: var(--primary-glow); color: var(--primary-light);
      border: 1px solid var(--border-accent);
    }

    /* Presets Strip */
    .preset-pill {
      padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.8rem;
      font-weight: 600; border: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated); color: var(--text-secondary);
      cursor: pointer; transition: all 0.2s ease;
    }
    .preset-pill:hover { border-color: var(--border-accent); color: var(--text-main); background: var(--bg-card-hover); }

    /* Results Showcase Card */
    .result-hero {
      border-radius: 24px; padding: 2.2rem; text-align: center;
      position: relative; overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.4);
    }
    .result-hero.low {
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.25), rgba(16, 185, 129, 0.05)), var(--bg-card);
      border-color: rgba(16, 185, 129, 0.4);
    }
    .result-hero.medium {
      background: radial-gradient(circle at center, rgba(245, 158, 11, 0.25), rgba(245, 158, 11, 0.05)), var(--bg-card);
      border-color: rgba(245, 158, 11, 0.4);
    }
    .result-hero.high {
      background: radial-gradient(circle at center, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.08)), var(--bg-card);
      border-color: rgba(239, 68, 68, 0.45);
    }
    .result-level-title {
      font-family: var(--font-heading);
      font-size: 3.5rem; font-weight: 900; line-height: 1; letter-spacing: -0.02em;
    }
    .result-hero.low .result-level-title { color: #34d399; }
    .result-hero.medium .result-level-title { color: #fbbf24; }
    .result-hero.high .result-level-title { color: #f87171; }

    /* 4-7-8 Breathing Circle Widget */
    .breath-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2.2rem 1.5rem; text-align: center;
    }
    .breath-circle-wrap {
      position: relative; width: 180px; height: 180px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
    }
    .breath-circle {
      width: 140px; height: 140px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.5), rgba(6, 182, 212, 0.25));
      border: 2px solid var(--border-accent);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      box-shadow: 0 0 30px var(--primary-glow);
      transition: transform 1s ease-in-out;
    }
    .breath-circle.inhale { transform: scale(1.25); box-shadow: 0 0 45px rgba(6, 182, 212, 0.7); }
    .breath-circle.hold { transform: scale(1.25); border-color: #f59e0b; box-shadow: 0 0 45px rgba(245, 158, 11, 0.7); }
    .breath-circle.exhale { transform: scale(0.9); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }

    /* Tables */
    .table-modern { width: 100%; border-collapse: separate; border-spacing: 0; }
    .table-modern th {
      padding: 0.85rem 1.2rem; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted); font-weight: 700;
      border-bottom: 1px solid var(--border-subtle); background: rgba(0,0,0,0.06);
    }
    .table-modern td {
      padding: 1rem 1.2rem; font-size: 0.88rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary); vertical-align: middle;
    }
    .table-modern tr:hover td { background: var(--bg-surface-elevated); color: var(--text-main); }

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ─── Production API Layer & Cloud Endpoint Configuration ─────────────────────
const API_TIMEOUT_MS = 75000;       // 75s timeout to accommodate Render free-tier cold starts
const PREDICT_TIMEOUT_MS = 90000;   // 90s timeout for model inference on cold starts

// Default production endpoints (overridable via localStorage or window.APP_CONFIG)
const DEFAULT_PROD_API = 'https://stressguard-backend-l5mp.onrender.com/api';
const DEFAULT_PROD_ML = 'https://ai-based-human-stress-prediction-system.onrender.com';

const getApiBase = () => {
  const custom = localStorage.getItem('api_endpoint');
  if (custom) return custom.replace(/\/+$/, '');
  if (window.APP_CONFIG && window.APP_CONFIG.API_URL) {
    return window.APP_CONFIG.API_URL.replace(/\/+$/, '');
  }
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return 'http://localhost:8080/api';
  }
  return DEFAULT_PROD_API;
};

const getMlBase = () => {
  const custom = localStorage.getItem('ml_endpoint');
  if (custom) return custom.replace(/\/+$/, '');
  if (window.APP_CONFIG && window.APP_CONFIG.ML_URL) {
    return window.APP_CONFIG.ML_URL.replace(/\/+$/, '');
  }
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return 'http://localhost:5000';
  }
  return DEFAULT_PROD_ML;
};

const toSnakeCase = (obj) => {
  const map = {
    anxietyLevel: 'anxiety_level', selfEsteem: 'self_esteem',
    mentalHealthHistory: 'mental_health_history', depression: 'depression',
    headache: 'headache', bloodPressure: 'blood_pressure',
    sleepQuality: 'sleep_quality', breathingProblem: 'breathing_problem',
    noiseLevel: 'noise_level', livingConditions: 'living_conditions',
    safety: 'safety', basicNeeds: 'basic_needs',
    academicPerformance: 'academic_performance', studyLoad: 'study_load',
    teacherStudentRelationship: 'teacher_student_relationship',
    futureCareerConcerns: 'future_career_concerns', socialSupport: 'social_support',
    peerPressure: 'peer_pressure', extracurricularActivities: 'extracurricular_activities',
    bullying: 'bullying'
  };
  const res = {};
  for (const k in obj) {
    res[map[k] || k] = obj[k];
  }
  return res;
};

const api = {
  token: () => localStorage.getItem('jwt_token'),
  headers: () => ({
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${api.token()}`
  }),

  async post(path, body, auth = false, customTimeout = null) {
    const timeoutDuration = customTimeout || (path === '/predict' ? PREDICT_TIMEOUT_MS : API_TIMEOUT_MS);
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutDuration);
    let serverResponded = false;

    try {
      const res = await fetch(getApiBase() + path, {
        method: 'POST',
        headers: auth ? { 'Content-Type': 'application/json' } : api.headers(),
        body: JSON.stringify(body),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      serverResponded = true;

      const text = await res.text();
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch { data = { message: text }; }
      }
      if (!res.ok) {
        const errorMsg = data.message || data.error || `Server responded with HTTP ${res.status}`;
        const err = new Error(errorMsg);
        err.status = res.status;
        throw err;
      }
      return data;
    } catch (err) {
      clearTimeout(timeoutId);

      // If server explicitly returned an error (e.g. 401 Bad credentials, 400 Validation), do NOT bypass into demo login
      if (serverResponded || (err.status && err.status >= 400)) {
        throw err;
      }

      const isNetworkOrTimeout = err.name === 'AbortError' || err.message?.includes('fetch') || err.message?.includes('Network');

      // Direct Cloud AI Fallback for predictions if backend is down or waking up
      if (path === '/predict' && isNetworkOrTimeout) {
        try {
          const cloudRes = await fetch(getMlBase() + '/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(toSnakeCase(body))
          });
          if (cloudRes.ok) {
            const ml = await cloudRes.json();
            const record = {
              id: Date.now(),
              stressLevel: ml.stress_level,
              stressLabel: ml.stress_label,
              confidence: ml.confidence,
              probabilities: ml.probabilities,
              topContributingFactors: ml.top_contributing_factors,
              recommendations: ml.recommendations,
              createdAt: new Date().toISOString()
            };
            const hist = JSON.parse(localStorage.getItem('local_predictions') || '[]');
            hist.unshift(record);
            localStorage.setItem('local_predictions', JSON.stringify(hist));
            return record;
          }
        } catch (mlErr) {
          throw new Error('Prediction microservice is warming up on the cloud. Please retry in 30 seconds.');
        }
      }

      // Offline / Demo Auth Fallback ONLY when network is completely unreachable
      const allowOfflineDemo = localStorage.getItem('allow_offline_demo') === 'true' || window.location.protocol === 'file:';
      if (allowOfflineDemo && isNetworkOrTimeout) {
        if (path === '/auth/login') {
          const u = body.username || 'demo';
          const isAdmin = u.toLowerCase() === 'admin';
          return {
            token: 'demo-jwt-token-' + Date.now(),
            username: u,
            email: `${u}@stressguard.ai`,
            fullName: isAdmin ? 'Administrator (Offline Demo)' : u.charAt(0).toUpperCase() + u.slice(1),
            role: isAdmin ? 'ADMIN' : 'USER',
            userId: 1
          };
        }
        if (path === '/auth/register') {
          return {
            token: 'demo-jwt-token-' + Date.now(),
            username: body.username,
            email: body.email,
            fullName: body.fullName || body.username,
            role: 'USER',
            userId: Date.now()
          };
        }
      }

      if (err.name === 'AbortError') {
        throw new Error('Request timed out while connecting to cloud server. If the server was sleeping, please retry.');
      }
      throw new Error(err.message || 'Unable to connect to backend server. Please verify your connection.');
    }
  },

  async get(path) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
    let serverResponded = false;

    try {
      const res = await fetch(getApiBase() + path, {
        headers: api.headers(),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      serverResponded = true;

      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem('jwt_token');
        throw new Error('Session expired or unauthorized. Please sign in again.');
      }

      const text = await res.text();
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch { data = { message: text }; }
      }
      if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
      return data;
    } catch (err) {
      clearTimeout(timeoutId);
      if (serverResponded && err.message.includes('Session expired')) {
        throw err;
      }

      // Local fallback for History & Dashboard
      const hist = JSON.parse(localStorage.getItem('local_predictions') || '[]');
      if (path === '/predict/history') {
        return hist;
      }
      if (path === '/predict/dashboard') {
        const low = hist.filter(h => h.stressLabel === 'Low').length;
        const med = hist.filter(h => h.stressLabel === 'Medium').length;
        const high = hist.filter(h => h.stressLabel === 'High').length;
        return {
          totalMyPredictions: hist.length,
          myLowCount: low,
          myMediumCount: med,
          myHighCount: high,
          latestStressLabel: hist[0]?.stressLabel || 'N/A',
          latestConfidence: hist[0]?.confidence || null,
          recentHistory: hist.slice(0, 5)
        };
      }
      if (path === '/admin/stats') {
        return {
          totalUsers: 1,
          totalPredictions: hist.length,
          lowStressCount: hist.filter(h => h.stressLabel === 'Low').length,
          mediumStressCount: hist.filter(h => h.stressLabel === 'Medium').length,
          highStressCount: hist.filter(h => h.stressLabel === 'High').length,
          averageConfidence: 88.6,
          activeUsersWithPredictions: hist.length > 0 ? 1 : 0
        };
      }
      if (path === '/admin/stress-distribution') {
        return {
          'Low': hist.filter(h => h.stressLabel === 'Low').length,
          'Medium': hist.filter(h => h.stressLabel === 'Medium').length,
          'High': hist.filter(h => h.stressLabel === 'High').length
        };
      }
      if (path.startsWith('/admin/recent-predictions')) {
        return hist.slice(0, 10);
      }
      if (path === '/admin/users') {
        const u = JSON.parse(localStorage.getItem('user_info') || '{}');
        return [
          { id: u.userId || 1, username: u.username || 'admin', fullName: u.fullName || 'Administrator', email: u.email || 'admin@stressguard.ai', totalPredictions: hist.length, lastStressLabel: hist[0]?.stressLabel || 'N/A', active: true }
        ];
      }
      throw err;
    }
  },

  async put(path, body) {
    const res = await fetch(getApiBase() + path, {
      method: 'PUT',
      headers: api.headers(),
      body: JSON.stringify(body)
    });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('jwt_token');
      throw new Error('Session expired or unauthorized. Please sign in again.');
    }
    const text = await res.text();
    let data = {};
    if (text) {
      try { data = JSON.parse(text); } catch { data = { message: text }; }
    }
    if (!res.ok) {
      throw new Error(data.message || data.error || `Request failed with HTTP ${res.status}`);
    }
    return data;
  },

  async del(path) {
    try {
      const res = await fetch(getApiBase() + path, { method: 'DELETE', headers: api.headers() });
      if (!res.ok) throw new Error('Delete failed');
    } catch(err) {
      return { success: true };
    }
  }
};

// ─── Web Audio Ambient Soundscape Generator ──────────────────────────────────
class AmbientSoundGenerator {
  constructor() {
    this.ctx = null;
    this.isPlaying = false;
    this.nodes = [];
  }

  start() {
    if (this.isPlaying) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioContext();

    // Pink / Gentle Rain Filtered Noise
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.06;
      b6 = white * 0.115926;
    }

    const whiteNoise = this.ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    // Soothing low-pass filter (simulates calm rain)
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 850;

    const gainNode = this.ctx.createGain();
    gainNode.gain.setValueAtTime(0.2, this.ctx.currentTime);

    whiteNoise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(this.ctx.destination);

    whiteNoise.start(0);
    this.nodes = [whiteNoise, filter, gainNode];
    this.isPlaying = true;
  }

  stop() {
    if (!this.isPlaying) return;
    this.nodes.forEach(n => { try { n.stop && n.stop(); n.disconnect(); } catch(e){} });
    if (this.ctx) { try { this.ctx.close(); } catch(e){} }
    this.isPlaying = false;
  }
}

// ─── Interactive 4-7-8 Breathing Tool ────────────────────────────────────────
function BreathingExerciseWidget() {
  const [active, setActive] = useState(false);
  const [phase, setPhase] = useState('Ready'); // 'Inhale', 'Hold', 'Exhale'
  const [countdown, setCountdown] = useState(4);

  useEffect(() => {
    if (!active) {
      setPhase('Ready');
      setCountdown(4);
      return;
    }

    let timer;
    let step = 0; // 0: inhale (4), 1: hold (7), 2: exhale (8)
    const phases = [
      { name: 'Inhale', duration: 4 },
      { name: 'Hold', duration: 7 },
      { name: 'Exhale', duration: 8 }
    ];

    setPhase(phases[0].name);
    setCountdown(phases[0].duration);

    const interval = setInterval(() => {
      setCountdown(prev => {
        if (prev > 1) return prev - 1;
        step = (step + 1) % 3;
        setPhase(phases[step].name);
        return phases[step].duration;
      });
    }, 1000);

    return () => clearInterval(interval);
  }, [active]);

  return (
    <div className="breath-box">
      <div className="breath-circle-wrap">
        <div className={`breath-circle ${active ? phase.toLowerCase() : ''}`}>
          <div style={{ fontSize: '0.78rem', textTransform: 'uppercase', letterSpacing: '0.1em', opacity: 0.8 }}>
            {phase}
          </div>
          <div style={{ fontFamily: 'var(--font-heading)', fontSize: '2.2rem', fontWeight: 800, lineHeight: 1 }}>
            {active ? countdown : '🧘'}
          </div>
        </div>
      </div>

      <div style={{ fontWeight: 700, fontSize: '1.05rem', marginBottom: '0.3rem' }}>
        4-7-8 Clinical Relaxation Pacer
      </div>
      <div style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', maxWidth: 280, marginBottom: '1.2rem' }}>
        {phase === 'Inhale' && 'Breathe in slowly through your nose...'}
        {phase === 'Hold' && 'Hold breath gently without straining...'}
        {phase === 'Exhale' && 'Release through your mouth with a gentle whoosh...'}
        {phase === 'Ready' && 'Stimulates the parasympathetic nervous system to quickly de-escalate anxiety.'}
      </div>

      <button
        className={active ? 'btn-glass' : 'btn-glow'}
        onClick={() => setActive(!active)}
      >
        {active ? '⏸ Pause Pacer' : '▶ Start Breathing Session'}
      </button>
    </div>
  );
}

// ─── Login & Register Page ──────────────────────────────────────────────────
function AuthView({ onLogin }) {
  const [isRegister, setIsRegister] = useState(() => window.location.hash === '#/register');
  const [form, setForm] = useState({ username: '', password: '' });
  const [regForm, setRegForm] = useState({ username: '', email: '', password: '', fullName: '', age: '', gender: '' });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  // Synchronize URL hash with authentication view
  useEffect(() => {
    const handleAuthHash = () => {
      setIsRegister(window.location.hash === '#/register');
    };
    if (window.location.hash !== '#/register' && window.location.hash !== '#/login') {
      window.history.replaceState(null, '', '#/login');
    }
    window.addEventListener('hashchange', handleAuthHash);
    return () => window.removeEventListener('hashchange', handleAuthHash);
  }, []);

  const switchAuthMode = (registerMode) => {
    setError('');
    const targetHash = registerMode ? '#/register' : '#/login';
    if (window.location.hash !== targetHash) {
      window.location.hash = targetHash;
    } else {
      setIsRegister(registerMode);
    }
  };

  const submitLogin = async (e) => {
    e.preventDefault();
    if (loading) return;
    setLoading(true); setError('');
    try {
      const data = await api.post('/auth/login', form, true);
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('user_info', JSON.stringify(data));
      window.location.hash = '#/dashboard';
      onLogin(data);
    } catch(err) {
      setError(err.message || 'Login failed. Please verify credentials or server status.');
    } finally {
      setLoading(false);
    }
  };

  const submitRegister = async (e) => {
    e.preventDefault();
    if (loading) return;
    setLoading(true); setError('');
    try {
      const payload = { ...regForm, age: parseInt(regForm.age) || null };
      const data = await api.post('/auth/register', payload, true);
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('user_info', JSON.stringify(data));
      window.location.hash = '#/dashboard';
      onLogin(data);
    } catch(err) {
      setError(err.message || 'Registration failed. Please try again.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem' }}>
      <div className="card-glass" style={{ width: '100%', maxWidth: 480, padding: '2.5rem' }}>
        <div style={{ textAlign: 'center', marginBottom: '1.8rem' }}>
          <div className="brand-icon" style={{ margin: '0 auto 1rem', width: 56, height: 56, fontSize: '1.8rem' }}>
            🧠
          </div>
          <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.75rem', marginBottom: '0.3rem' }}>
            StressGuard AI 2.0
          </h2>
          <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem' }}>
            Advanced Machine Learning Mental Health Intelligence
          </p>
        </div>

        {error && (
          <div style={{ padding: '0.8rem 1rem', borderRadius: 12, background: 'var(--danger-bg)', border: '1px solid var(--danger)', color: '#f87171', fontSize: '0.85rem', marginBottom: '1.2rem' }}>
            ⚠️ {error}
          </div>
        )}

        {!isRegister ? (
          <form onSubmit={submitLogin}>
            <div className="mb-3">
              <label style={{ fontSize: '0.82rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.4rem', display: 'block' }}>Username</label>
              <input
                className="form-control-modern"
                placeholder="e.g. admin or testuser"
                value={form.username}
                onChange={e => setForm({ ...form, username: e.target.value })}
                required
              />
            </div>
            <div className="mb-4">
              <label style={{ fontSize: '0.82rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.4rem', display: 'block' }}>Password</label>
              <input
                type="password"
                className="form-control-modern"
                placeholder="Enter your password"
                value={form.password}
                onChange={e => setForm({ ...form, password: e.target.value })}
                required
              />
            </div>
            <button type="submit" className="btn-glow w-100" style={{ padding: '0.8rem' }} disabled={loading}>
              {loading ? '⏳ Verifying Credentials (wake-up ~45s if idle)...' : '🔐 Sign In to Platform'}
            </button>
            <div className="text-center mt-3" style={{ fontSize: '0.86rem', color: 'var(--text-secondary)' }}>
              Need an account?{' '}
              <span style={{ color: 'var(--primary-light)', cursor: 'pointer', fontWeight: 700 }} onClick={() => switchAuthMode(true)}>
                Register here
              </span>
            </div>
            <div style={{ marginTop: '1.5rem', padding: '0.9rem', borderRadius: 12, background: 'rgba(99,102,241,0.08)', border: '1px solid var(--border-subtle)', fontSize: '0.78rem', color: 'var(--text-secondary)' }}>
              <strong>First time here?</strong> Please click <span style={{ color: 'var(--primary-light)', cursor: 'pointer', fontWeight: 600 }} onClick={() => switchAuthMode(true)}>Register here</span> above to create your secure account.<br />
              <span style={{ fontSize: '0.74rem', color: 'var(--text-muted)' }}>Demo seed accounts are available only in local development when initialized via seed-dev.sql.</span>

          </form>
        ) : (
          <form onSubmit={submitRegister}>

              <div className="col-6">
                <label style={{ fontSize: '0.8rem', fontWeight: 600 }}>Username *</label>
                <input className="form-control-modern" value={regForm.username} onChange={e=>setRegForm({...regForm,username:e.target.value})} required />

              </div>
              <div className="col-3 mt-2">
                <label style={{ fontSize: '0.8rem', fontWeight: 600 }}>Gender</label>
                <select className="form-control-modern" value={regForm.gender} onChange={e=>setRegForm({...regForm,gender:e.target.value})}>
                  <option value="">—</option>
                  <option>Male</option><option>Female</option><option>Other</option>
                </select>
              </div>
            </div>
            <button type="submit" className="btn-glow w-100" style={{ padding: '0.8rem' }} disabled={loading}>
              {loading ? '⏳ Creating Account on Server...' : '✅ Complete Registration'}
            </button>
            <div className="text-center mt-3" style={{ fontSize: '0.86rem', color: 'var(--text-secondary)' }}>
              Already registered?{' '}
              <span style={{ color: 'var(--primary-light)', cursor: 'pointer', fontWeight: 700 }} onClick={() => switchAuthMode(false)}>

function DashboardView({ user, setPage }) {
  const [data, setData] = useState(null);
  const [history, setHistory] = useState([]);
  const donutChartRef = useRef();
  const trendChartRef = useRef();
  const donutInst = useRef();
  const trendInst = useRef();

  useEffect(() => {
    Promise.all([
      api.get('/predict/dashboard'),
      api.get('/predict/history')
    ]).then(([dash, hist]) => {
      setData(dash);
      setHistory(hist);
    }).catch(console.error);
  }, []);

  // Compute Wellness Index (0 to 100)
  const wellnessIndex = useMemo(() => {
    if (!data || data.totalMyPredictions === 0) return 85;
    const low = data.myLowCount || 0;
    const med = data.myMediumCount || 0;
    const high = data.myHighCount || 0;
    const total = low + med + high || 1;
    const score = Math.round(((low * 100) + (med * 60) + (high * 20)) / total);
    return Math.max(10, Math.min(98, score));
  }, [data]);

  // Donut Chart
  useEffect(() => {
    if (!data || !donutChartRef.current) return;
    if (donutInst.current) donutInst.current.destroy();

    donutInst.current = new Chart(donutChartRef.current, {
      type: 'doughnut',
      data: {
        labels: ['Low Stress', 'Medium Stress', 'High Stress'],
        datasets: [{
          data: [data.myLowCount || 0, data.myMediumCount || 0, data.myHighCount || 0],
          backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
          borderWidth: 0,
          hoverOffset: 6
        }]
      },
      options: {
        cutout: '72%',
        plugins: {
          legend: { position: 'bottom', labels: { color: 'rgba(148, 163, 184, 0.9)', font: { family: 'Plus Jakarta Sans', size: 11 } } }
        },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }, [data]);

  // Trend Chart (Stress over time)
  useEffect(() => {
    if (!history.length || !trendChartRef.current) return;
    if (trendInst.current) trendInst.current.destroy();

    const sorted = [...history].sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)).slice(-10);
    const labels = sorted.map(h => new Date(h.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' }));
    const scores = sorted.map(h => h.stressLabel === 'Low' ? 1 : h.stressLabel === 'Medium' ? 2 : 3);

    trendInst.current = new Chart(trendChartRef.current, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Stress Tier',
          data: scores,
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99, 102, 241, 0.15)',
          fill: true,
          tension: 0.4,
          pointRadius: 5,

        }]
      },
      options: {
        scales: {
          y: {
            min: 0.5, max: 3.5,
            ticks: {
              stepSize: 1,
              callback: v => v === 1 ? 'Low' : v === 2 ? 'Medium' : v === 3 ? 'High' : ''

            grid: { color: 'rgba(255,255,255,0.06)' }

          x: { grid: { color: 'rgba(255,255,255,0.06)' } }
        },
        plugins: { legend: { display: false } },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }, [history]);

  if (!data) return <div style={{ padding: '3rem', textAlign: 'center', color: 'var(--text-muted)' }}>⏳ Initializing your personalized intelligence dashboard...</div>;

  return (
    <div style={{ padding: '2rem' }}>
      {/* Welcome Banner */}
      <div className="card-glass mb-4" style={{ padding: '1.8rem 2rem', background: 'linear-gradient(135deg, rgba(99,102,241,0.18), rgba(6,182,212,0.12))' }}>
        <div className="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <div style={{ fontSize: '0.8rem', textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--secondary)', fontWeight: 700 }}>
              🧠 Personal Wellness Cockpit
            </div>
            <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: '0.3rem 0' }}>
              Welcome back, {user?.fullName || user?.username}!
            </h2>
            <p style={{ margin: 0, color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
              Real-time physiological, cognitive, and environmental stress surveillance powered by Random Forest AI.
            </p>
          </div>
          <div className="d-flex gap-2">
            <button className="btn-glow" onClick={() => setPage('predict')}>
              <Icon name="sparkles" size={17} /> New AI Assessment
            </button>
            <button className="btn-glass" onClick={() => window.print()}>
              <Icon name="printer" size={16} /> Print Report

// ─── Prediction Page (5-Domain Assessment & Presets) ─────────────────────────
function PredictionView() {
  const [activeDomain, setActiveDomain] = useState('psychological');
  const [vals, setVals] = useState(() => {
    return ALL_FIELDS.reduce((acc, f) => ({ ...acc, [f.key]: Math.floor((f.min + f.max) / 2) }), {});
  });
  const [rawInputs, setRawInputs] = useState(() => {
    return ALL_FIELDS.reduce((acc, f) => ({ ...acc, [f.key]: String(Math.floor((f.min + f.max) / 2)) }), {});
  });
  const [errors, setErrors] = useState({});
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [topError, setTopError] = useState('');
  const [actionDone, setActionDone] = useState({});

  const probChartRef = useRef();
  const radarChartRef = useRef();
  const probInst = useRef();
  const radarInst = useRef();

  const applyPreset = (preset) => {
    setVals(prev => ({ ...prev, ...preset.values }));
    const newRaw = {};
    Object.keys(preset.values).forEach(k => {
      newRaw[k] = String(preset.values[k]);
    });
    setRawInputs(prev => ({ ...prev, ...newRaw }));
    setErrors({});
    setTopError('');
    setResult(null);
  };

  const handleSliderChange = (key, numVal) => {
    setVals(prev => ({ ...prev, [key]: numVal }));
    setRawInputs(prev => ({ ...prev, [key]: String(numVal) }));
    setErrors(prev => {
      if (!prev[key]) return prev;
      const next = { ...prev };
      delete next[key];
      return next;
    });
  };

  const handleNumericChange = (key, strVal, min, max) => {
    setRawInputs(prev => ({ ...prev, [key]: strVal }));

    const trimmed = strVal.trim();
    if (trimmed === '') {
      setErrors(prev => ({ ...prev, [key]: 'Value is required' }));
      return;
    }

    const num = Number(trimmed);
    if (isNaN(num)) {
      setErrors(prev => ({ ...prev, [key]: 'Must be a valid number' }));
      return;
    }

    if (!Number.isInteger(num)) {
      setErrors(prev => ({ ...prev, [key]: 'Must be a whole number' }));
      return;
    }

    if (num < min || num > max) {
      setErrors(prev => ({ ...prev, [key]: `Must be between ${min} and ${max}` }));
      return;
    }

    // Valid integer: immediately synchronize slider value!
    setVals(prev => ({ ...prev, [key]: num }));
    setErrors(prev => {
      if (!prev[key]) return prev;
      const next = { ...prev };
      delete next[key];
      return next;
    });
  };

  const handleNumericBlur = (key, min, max) => {
    const raw = rawInputs[key];
    const trimmed = (raw !== undefined && raw !== null) ? String(raw).trim() : '';
    if (trimmed === '') {
      setErrors(prev => ({ ...prev, [key]: 'Value is required' }));
      return;
    }
    const num = Number(trimmed);
    if (isNaN(num) || !Number.isInteger(num) || num < min || num > max) {
      // Keep invalid input for user correction; do not silently overwrite
      return;
    }
    setRawInputs(prev => ({ ...prev, [key]: String(num) }));
    setVals(prev => ({ ...prev, [key]: num }));
  };

  const handlePredict = async (e) => {
    e.preventDefault();
    if (loading) return;

    // Validate all 20 fields across ALL domains
    const newErrors = {};
    let firstInvalidDomain = null;

    for (const domain of FEATURE_DOMAINS) {
      for (const f of domain.features) {
        const raw = rawInputs[f.key];
        const trimmed = (raw !== undefined && raw !== null) ? String(raw).trim() : '';

        if (trimmed === '') {
          newErrors[f.key] = 'Value is required';
          if (!firstInvalidDomain) firstInvalidDomain = domain.id;
        } else {
          const num = Number(trimmed);
          if (isNaN(num)) {
            newErrors[f.key] = 'Must be a valid number';
            if (!firstInvalidDomain) firstInvalidDomain = domain.id;
          } else if (!Number.isInteger(num)) {
            newErrors[f.key] = 'Must be a whole number';
            if (!firstInvalidDomain) firstInvalidDomain = domain.id;
          } else if (num < f.min || num > f.max) {
            newErrors[f.key] = `Must be between ${f.min} and ${f.max}`;
            if (!firstInvalidDomain) firstInvalidDomain = domain.id;
          }
        }
      }
    }

    if (Object.keys(newErrors).length > 0) {
      setErrors(newErrors);
      if (firstInvalidDomain) {
        setActiveDomain(firstInvalidDomain);
      }
      setTopError('⚠️ Please correct the invalid biomarker values (highlighted in red) before running inference.');
      return;
    }

    setTopError('');
    setLoading(true);
    setResult(null);

    // Build payload ensuring all 20 values are strictly integers
    const payload = {};
    ALL_FIELDS.forEach(f => {
      payload[f.key] = parseInt(vals[f.key], 10);
    });

    try {
      const data = await api.post('/predict', payload);
      setResult(data);
    } catch(err) {
      setTopError(err.message || 'Inference request failed. Please check backend connection.');
    } finally {
      setLoading(false);
    }
  };

  // Probability Distribution Bar Chart
  useEffect(() => {
    if (!result || !probChartRef.current) return;
    if (probInst.current) probInst.current.destroy();

    const p = result.probabilities;
    probInst.current = new Chart(probChartRef.current, {
      type: 'bar',
      data: {
        labels: ['Low Stress', 'Medium Stress', 'High Risk'],
        datasets: [{
          data: [p.Low, p.Medium, p.High],
          backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
          borderRadius: 8
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' }, grid: { color: 'rgba(255,255,255,0.06)' } },
          x: { grid: { display: false } }
        },
        plugins: { legend: { display: false } },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }, [result]);

  // Radar / Spider Chart across 5 Domains
  useEffect(() => {
    if (!result || !radarChartRef.current) return;
    if (radarInst.current) radarInst.current.destroy();

    // Calculate domain vulnerability scores (0 - 100%)
    const domainScores = [
      Math.round(((vals.anxietyLevel/21 + (30-vals.selfEsteem)/30 + vals.depression/27) / 3) * 100), // Psycho
      Math.round(((vals.headache/5 + vals.bloodPressure/3 + (9-vals.sleepQuality)/9 + vals.breathingProblem/5) / 4) * 100), // Physio
      Math.round(((vals.noiseLevel/7 + (5-vals.livingConditions)/5 + (5-vals.safety)/5 + (5-vals.basicNeeds)/5) / 4) * 100), // Environ
      Math.round(((vals.studyLoad/5 + (5-vals.academicPerformance)/5 + (5-vals.teacherStudentRelationship)/5 + vals.futureCareerConcerns/5) / 4) * 100), // Academic
      Math.round(((vals.peerPressure/5 + (3-vals.socialSupport)/3 + vals.bullying/5) / 3) * 100), // Social
    ];

    radarInst.current = new Chart(radarChartRef.current, {
      type: 'radar',
      data: {
        labels: ['Psychological', 'Physiological', 'Living Env', 'Academic Load', 'Social Strain'],
        datasets: [
          {
            label: 'Your Current Strain Profile',
            data: domainScores,
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.25)',
            borderWidth: 2,
            pointBackgroundColor: '#6366f1'
          },
          {
            label: 'Healthy Clinical Baseline',
            data: [20, 15, 20, 25, 15],
            borderColor: '#10b981',
            borderDash: [4, 4],
            backgroundColor: 'rgba(16, 185, 129, 0.08)',
            borderWidth: 1.5,
            pointBackgroundColor: '#10b981'
          }
        ]
      },
      options: {
        scales: {
          r: {
            angleLines: { color: 'rgba(255,255,255,0.08)' },
            grid: { color: 'rgba(255,255,255,0.08)' },
            pointLabels: { color: 'rgba(148, 163, 184, 0.9)', font: { size: 10 } },
            ticks: { display: false },
            suggestedMin: 0,
            suggestedMax: 100
          }
        },
        plugins: {
          legend: { position: 'bottom', labels: { color: 'rgba(148, 163, 184, 0.9)', font: { size: 10 } } }
        },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }, [result, vals]);

  const currentDomainObj = FEATURE_DOMAINS.find(d => d.id === activeDomain);

  return (
    <div style={{ padding: '2rem' }}>
      <div className="mb-4">
        <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: 0 }}>
          🔮 Multidimensional Stress Assessment
        </h2>
        <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem', marginTop: '0.3rem' }}>
          Evaluate 20 distinct biomarkers and environmental parameters across 5 critical dimensions.
        </p>
      </div>

      {/* Preset Personas Bar */}
      <div className="card-glass mb-4" style={{ padding: '1rem 1.4rem' }}>
        <div className="d-flex align-items-center justify-content-between flex-wrap gap-2">
          <span style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>
            ⚡ 1-Click Clinical Presets:
          </span>
          <div className="d-flex gap-2 flex-wrap">
            {CLINICAL_PRESETS.map(preset => (
              <button
                key={preset.id}
                type="button"
                className="preset-pill"
                onClick={() => applyPreset(preset)}
                title={preset.desc}
              >
                {preset.title}
              </button>
            ))}
          </div>
        </div>
      </div>

      {topError && (
        <div style={{ padding: '0.9rem 1.2rem', borderRadius: 14, background: 'var(--danger-bg)', border: '1px solid var(--danger)', color: '#f87171', marginBottom: '1.5rem', fontSize: '0.88rem' }}>
          {topError}
        </div>
      )}

      <div className="row g-4">
        {/* Assessment Form */}
        <div className="col-lg-7">
          <div className="card-glass">
            {/* Domain Tabs */}
            <div style={{ padding: '1.2rem 1.4rem 0.5rem', borderBottom: '1px solid var(--border-subtle)' }}>
              <div className="category-tabs mb-0">
                {FEATURE_DOMAINS.map(d => {
                  const errCount = d.features.filter(f => errors[f.key]).length;
                  return (
                    <button
                      key={d.id}
                      type="button"
                      className={`cat-tab ${activeDomain === d.id ? 'active' : ''}`}
                      onClick={() => setActiveDomain(d.id)}
                    >
                      <span>{d.icon}</span> {d.title}
                      {errCount > 0 && <span className="domain-error-badge">{errCount}</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            <form onSubmit={handlePredict} noValidate style={{ padding: '1.6rem' }}>
              <div style={{ marginBottom: '1.2rem' }}>
                <h5 style={{ fontFamily: 'var(--font-heading)', fontWeight: 700, margin: 0 }}>
                  {currentDomainObj.icon} {currentDomainObj.title}
                </h5>
                <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', margin: 0 }}>
                  {currentDomainObj.desc}
                </p>
              </div>

              <div className="row g-3">
                {currentDomainObj.features.map(f => (
                  <div className="col-12" key={f.key}>
                    <div className={`biomarker-card ${errors[f.key] ? 'has-error' : ''}`}>
                      <div className="biomarker-header">
                        <div className="biomarker-title-wrap">
                          <label htmlFor={`input-${f.key}`} className="biomarker-title">
                            {f.label}
                          </label>
                          <div className="biomarker-hint">{f.info}</div>
                        </div>
                        <div className="biomarker-input-wrap">
                          <span className="biomarker-input-label">Value:</span>
                          <input
                            id={`input-${f.key}`}
                            type="number"
                            min={f.min}
                            max={f.max}
                            step="1"
                            className={`biomarker-num-input ${errors[f.key] ? 'is-invalid' : ''}`}
                            value={rawInputs[f.key] !== undefined ? rawInputs[f.key] : vals[f.key]}
                            onChange={e => handleNumericChange(f.key, e.target.value, f.min, f.max)}
                            onBlur={() => handleNumericBlur(f.key, f.min, f.max)}
                            aria-label={`${f.label} numeric input`}
                            aria-invalid={errors[f.key] ? 'true' : 'false'}
                            aria-describedby={errors[f.key] ? `err-${f.key}` : undefined}
                          />
                        </div>
                      </div>

                      <div className="biomarker-track-container">
                        <input
                          type="range"
                          id={`slider-${f.key}`}
                          min={f.min}
                          max={f.max}
                          step="1"
                          value={vals[f.key] !== undefined && !isNaN(vals[f.key]) ? vals[f.key] : f.min}
                          onChange={e => handleSliderChange(f.key, parseInt(e.target.value, 10))}
                          className="biomarker-slider"
                          aria-label={`${f.label} range slider`}
                          aria-valuemin={f.min}
                          aria-valuemax={f.max}
                          aria-valuenow={vals[f.key]}
                        />
                      </div>

                      <div className="biomarker-scale-labels">
                        <span className="min-tag">Min: {f.min}</span>
                        <span className="unit-tag">{f.unit || f.info}</span>
                        <span className="max-tag">Max: {f.max}</span>
                      </div>

                      {errors[f.key] && (
                        <div id={`err-${f.key}`} className="biomarker-error-msg" role="alert">
                          ⚠️ {errors[f.key]}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>

              <div className="d-flex justify-content-between align-items-center mt-4 pt-3 flex-wrap gap-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                <div className="d-flex gap-2 flex-wrap">
                  {FEATURE_DOMAINS.map((d, i) => {
                    const errCount = d.features.filter(f => errors[f.key]).length;
                    return (
                      <button
                        key={d.id}
                        type="button"
                        className={`btn-glass ${activeDomain === d.id ? 'active' : ''}`}
                        style={{ padding: '0.4rem 0.7rem', fontSize: '0.78rem' }}
                        onClick={() => setActiveDomain(d.id)}
                      >
                        {d.icon} {i+1}
                        {errCount > 0 && <span className="domain-error-badge" style={{ fontSize: '0.62rem', minWidth: 15, height: 15 }}>{errCount}</span>}
                      </button>
                    );
                  })}
                </div>

                <button type="submit" className="btn-glow" disabled={loading} style={{ padding: '0.75rem 2rem' }}>
                  {loading ? '⏳ Computing Inference...' : '🧠 Run Random Forest Analysis'}
                </button>
              </div>
            </form>
          </div>
        </div>

        {/* Results / Live Telemetry Column */}
        <div className="col-lg-5">
          {result ? (
            <div className="d-flex flex-column gap-3">
              {/* Main Classification Hero */}
              <div className={`result-hero ${result.stressLabel?.toLowerCase()}`}>
                <div style={{ fontSize: '0.82rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.12em', opacity: 0.8, marginBottom: '0.4rem' }}>
                  PREDICTED STRESS LEVEL
                </div>
                <div className="result-level-title">
                  {result.stressLabel?.toUpperCase()}
                </div>
                <div style={{ marginTop: '0.6rem', fontSize: '0.92rem', fontWeight: 600 }}>
                  Random Forest Confidence: <span style={{ color: 'var(--primary-light)', fontWeight: 800 }}>{result.confidence?.toFixed(1)}%</span>
                </div>
              </div>

              {/* 5-Axis Radar Map */}
              <div className="card-glass">
                <div className="card-glass-header">
                  <span>🕸️ 5-Domain Vulnerability Radar</span>
                </div>
                <div className="card-glass-body" style={{ height: 260 }}>
                  <canvas ref={radarChartRef} />
                </div>
              </div>

              {/* Probability Breakdown */}
              <div className="card-glass">
                <div className="card-glass-header">
                  <span>📊 Probability Distribution</span>
                </div>
                <div className="card-glass-body" style={{ height: 180 }}>
                  <canvas ref={probChartRef} />
                </div>
              </div>

              {/* Contributing Factors */}
              <div className="card-glass">
                <div className="card-glass-header">
                  <span>🔑 Top Contributing Stress Biomarkers</span>
                </div>
                <div className="card-glass-body">
                  {Object.entries(result.topContributingFactors || {}).map(([k, v]) => (
                    <div key={k} className="mb-2">
                      <div className="d-flex justify-content-between mb-1" style={{ fontSize: '0.82rem' }}>
                        <span style={{ fontWeight: 600 }}>{k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
                        <span style={{ color: 'var(--primary-light)', fontWeight: 700 }}>{v.toFixed(1)}% impact</span>
                      </div>
                      <div style={{ height: 7, borderRadius: 4, background: 'rgba(255,255,255,0.08)', overflow: 'hidden' }}>
                        <div style={{ height: '100%', width: `${Math.min(v * 4.5, 100)}%`, background: 'linear-gradient(90deg, #6366f1, #06b6d4)', borderRadius: 4 }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Action Plan Checklist */}
              <div className="card-glass">
                <div className="card-glass-header">
                  <span>💡 Clinical Guidance & Action Plan</span>
                </div>
                <div className="card-glass-body">
                  {result.recommendations?.map((rec, i) => (
                    <div
                      key={i}
                      style={{
                        padding: '0.8rem 1rem', borderRadius: 12, marginBottom: '0.6rem',
                        background: actionDone[i] ? 'rgba(16, 185, 129, 0.15)' : 'var(--bg-surface-elevated)',
                        border: '1px solid var(--border-subtle)',
                        display: 'flex', alignItems: 'center', gap: '0.75rem', cursor: 'pointer',
                        textDecoration: actionDone[i] ? 'line-through' : 'none',

// ─── Safe Date Parsing Helpers for Jackson Arrays & ISO Strings ─────────────
const safeDate = (val) => {
  if (!val) return null;
  if (Array.isArray(val)) {
    return new Date(val[0], val[1] - 1, val[2], val[3] || 0, val[4] || 0, val[5] || 0);
  }
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
};

const safeISO = (val) => {
  const d = safeDate(val);
  return d ? d.toISOString() : (val ? String(val) : '');
};

const safeLocale = (val) => {
  const d = safeDate(val);
  return d ? d.toLocaleString() : 'N/A';
};

function HistoryView({ setPage }) {

  const fetchHistory = () => {

    setErrorMsg('');

      .then(d => {
        setHistory(Array.isArray(d) ? d : []);
        setLoading(false);
      })
      .catch(err => {
        setErrorMsg('Failed to load prediction history. Please check connection and retry.');
        setLoading(false);
      });
  };

  useEffect(() => {
    fetchHistory();
  }, []);

  useEffect(() => {
    window.__exportHistoryCSV = (filename) => exportRecordsToCSV(sorted.length ? sorted : history, filename);
  }, [sorted, history]);

  const CSV_HEADERS = [
    'ID',
    'Recorded_Timestamp',
    'Stress_Category',
    'Stress_Level',
    'Confidence_Percentage',
    'Anxiety_Level',
    'Self_Esteem',
    'Mental_Health_History',
    'Depression',
    'Headache_Frequency',
    'Blood_Pressure',
    'Sleep_Quality',
    'Breathing_Problem',
    'Ambient_Noise',
    'Living_Conditions',
    'Safety_Perception',
    'Basic_Needs',
    'Academic_Performance',
    'Study_Load',
    'Mentor_Relationship',
    'Career_Concerns',
    'Social_Support',
    'Peer_Pressure',
    'Extracurricular_Activities',
    'Bullying_Severity'
  ];

  const exportRecordsToCSV = (recordsToExport, customFilename) => {
    if (!recordsToExport || !recordsToExport.length) return;
    const escapeVal = (v) => {
      if (v === null || v === undefined) return '';
      const str = String(v);
      if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    };

    const rows = recordsToExport.map(h => [
      h.id,
      safeISO(h.createdAt),
      h.stressLabel || '',
      h.stressLevel != null ? h.stressLevel : '',
      h.confidence != null ? Number(h.confidence).toFixed(1) : '',
      h.anxietyLevel != null ? h.anxietyLevel : '',
      h.selfEsteem != null ? h.selfEsteem : '',
      h.mentalHealthHistory != null ? h.mentalHealthHistory : '',
      h.depression != null ? h.depression : '',
      h.headache != null ? h.headache : '',
      h.bloodPressure != null ? h.bloodPressure : '',
      h.sleepQuality != null ? h.sleepQuality : '',
      h.breathingProblem != null ? h.breathingProblem : '',
      h.noiseLevel != null ? h.noiseLevel : '',
      h.livingConditions != null ? h.livingConditions : '',
      h.safety != null ? h.safety : '',
      h.basicNeeds != null ? h.basicNeeds : '',
      h.academicPerformance != null ? h.academicPerformance : '',
      h.studyLoad != null ? h.studyLoad : '',
      h.teacherStudentRelationship != null ? h.teacherStudentRelationship : '',
      h.futureCareerConcerns != null ? h.futureCareerConcerns : '',
      h.socialSupport != null ? h.socialSupport : '',
      h.peerPressure != null ? h.peerPressure : '',
      h.extracurricularActivities != null ? h.extracurricularActivities : '',
      h.bullying != null ? h.bullying : ''
    ]);

    const csvContent = '\uFEFF' + [CSV_HEADERS.join(','), ...rows.map(r => r.map(escapeVal).join(','))].join('\r\n');
    window.__lastExportedCSV = csvContent;
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    const defaultFilename = `stressguard_prediction_history_${new Date().toISOString().slice(0, 10)}.csv`;
    link.setAttribute('download', customFilename || defaultFilename);
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
      if (document.body.contains(link)) document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, 2500);

    setExportToast(`Exported ${recordsToExport.length} complete telemetry records to CSV!`);
    setTimeout(() => setExportToast(null), 4000);
  };

  const handleClearFilters = () => {
    setFilterTier('ALL');
    setSearch('');
    setStartDate('');
    setEndDate('');
    setSortBy('date-desc');
  };

  const isFiltered = filterTier !== 'ALL' || search.trim() !== '' || startDate !== '' || endDate !== '';

  const filtered = history.filter(h => {
    if (filterTier !== 'ALL' && (h.stressLabel || '').toUpperCase() !== filterTier) return false;

    if (search.trim()) {
      const q = search.toLowerCase().trim();
      const idMatch = String(h.id).includes(q) || ('#' + h.id).includes(q);
      const tierMatch = (h.stressLabel || '').toLowerCase().includes(q);
      const recDate = safeDate(h.createdAt);
      const dateText = recDate ? recDate.toLocaleDateString().toLowerCase() : '';
      const dateTextLong = recDate ? recDate.toLocaleString().toLowerCase() : '';
      if (!idMatch && !tierMatch && !dateText.includes(q) && !dateTextLong.includes(q)) return false;
    }

    if (startDate && h.createdAt) {
      const recDate = safeDate(h.createdAt);
      const start = new Date(startDate);
      start.setHours(0, 0, 0, 0);
      if (recDate && recDate < start) return false;
    }

    if (endDate && h.createdAt) {
      const recDate = safeDate(h.createdAt);
      const end = new Date(endDate);
      end.setHours(23, 59, 59, 999);
      if (recDate && recDate > end) return false;
    }

    return true;
  });

  const sorted = [...filtered].sort((a, b) => {
    const tA = safeDate(a.createdAt)?.getTime() || 0;
    const tB = safeDate(b.createdAt)?.getTime() || 0;
    if (sortBy === 'date-desc') return tB - tA;
    if (sortBy === 'date-asc') return tA - tB;
    if (sortBy === 'confidence-desc') return (b.confidence || 0) - (a.confidence || 0);
    if (sortBy === 'confidence-asc') return (a.confidence || 0) - (b.confidence || 0);
    if (sortBy === 'stress-desc') return (b.stressLevel || 0) - (a.stressLevel || 0);
    if (sortBy === 'stress-asc') return (a.stressLevel || 0) - (b.stressLevel || 0);
    return 0;
  });

  return (
    <div style={{ padding: '2rem' }}>
      {/* Toast Notification */}
      {exportToast && (
        <div style={{
          position: 'fixed',
          top: '1.5rem',
          right: '1.5rem',
          background: 'rgba(16, 185, 129, 0.95)',
          color: '#fff',
          padding: '0.85rem 1.4rem',
          borderRadius: 'var(--radius-md)',
          boxShadow: '0 10px 25px rgba(0,0,0,0.4)',
          zIndex: 10000,
          fontWeight: 600,
          display: 'flex',
          alignItems: 'center',
          gap: '0.6rem',
          animation: 'fadeIn 0.2s ease-out'
        }}>
          <Icon name="check" size={18} color="#fff" />
          <span>{exportToast}</span>
        </div>
      )}

      {/* Header */}
      <div className="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
          <h2 style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.8rem', margin: 0 }}>
            📋 Prediction Logs & Clinical History
          </h2>
          <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem', margin: '0.25rem 0 0' }}>
            Complete audit trail of user submissions with confidence indices, 20-biomarker telemetry, and export capabilities.
          </p>
        </div>

        <div className="d-flex gap-2 flex-wrap">
          <button
            className="btn-glow"
            onClick={() => exportRecordsToCSV(sorted.length ? sorted : history)}
            disabled={!history.length}
            title="Export all visible records with all 20 biomarkers to CSV"
          >
            <Icon name="download" size={16} /> Export to CSV ({sorted.length})
          </button>
          <button className="btn-glass" onClick={() => window.print()} title="Print history summary">
            <Icon name="printer" size={16} /> Print Sheet
          </button>
        </div>
      </div>

      {/* Main Glass Card */}
      <div className="card-glass">
        {/* Controls: Search, Filters, Dates, Sort */}
        <div style={{ padding: '1rem 1.4rem', borderBottom: '1px solid var(--border-subtle)', display: 'flex', gap: '0.85rem', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between' }}>
          {/* Stress Tier Pills */}
          <div className="d-flex gap-2 flex-wrap align-items-center">
            {['ALL', 'LOW', 'MEDIUM', 'HIGH'].map(tier => (
              <button
                key={tier}
                className={`preset-pill ${filterTier === tier ? 'btn-glass' : ''}`}

            ))}
          </div>

          {/* Date Range Inputs & Search */}
          <div className="d-flex gap-2 flex-wrap align-items-center">
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', fontSize: '0.78rem', color: 'var(--text-muted)' }}>
