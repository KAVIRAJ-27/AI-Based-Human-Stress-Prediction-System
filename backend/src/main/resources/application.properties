# ==============================================================================
# StressGuard AI Backend Configuration
# Supports Local Development & Production Cloud Deployment (Render / TiDB Cloud)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# Optional local overrides (git-ignored, safe for developer machines)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (TiDB Cloud / Aiven / Local MySQL fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stress_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool (Optimized for Serverless & Low-Memory Containers)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:StressPredictionSecretKey2024VeryLongAndSecureKeyForJWTTokenGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Python ML Microservice URL (Local fallback or Render production URL)
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

# Logging Configuration
logging.level.root=WARN
logging.level.com.stress=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# CORS Configuration (Comma-separated allowed domains or * for development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
