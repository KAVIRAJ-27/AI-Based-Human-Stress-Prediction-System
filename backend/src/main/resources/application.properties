# Server
server.port=8080
server.servlet.context-path=/api

# Database (Aiven MySQL - Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=StressPredictionSecretKey2024VeryLongAndSecureKeyForJWTTokenGeneration
jwt.expiration=86400000

# ML Service URL (Render)
ml.service.url=https://ai-based-human-stress-prediction-system.onrender.com

# Logging
logging.level.com.stress=INFO
logging.level.org.springframework.security=WARN

# CORS
cors.allowed-origins=http://localhost:3000