# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database (Aiven / Local MySQL - Environment Variables with local fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stress_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:54400171}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=StressPredictionSecretKey2024VeryLongAndSecureKeyForJWTTokenGeneration
jwt.expiration=86400000

# ML Service URL (Render / Local)
ml.service.url=${ML_SERVICE_URL:https://ai-based-human-stress-prediction-system.onrender.com}

# Logging
logging.level.com.stress=INFO
logging.level.org.springframework.security=WARN

# CORS
cors.allowed-origins=*